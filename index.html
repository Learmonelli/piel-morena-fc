<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0c2814">
<title>Piel Morena FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c2814; --bg2:#3f111e; --card:#3f111e; --card2:#52182a; --line:#7a2a3c;
    --txt:#eafff0; --muted:#9fd3ac;
    --gold:#ffd23f; --gold-d:#d9a400;
    --burgundy:#8a2334; --purple:#8a4fbf; --green:#5fd35f; --red:#ff5a5f;
    --skin:#b5703c; --cream:#f3ead6;
    --font-body:'VT323',ui-monospace,Consolas,monospace;
    --font-pixel:'Press Start 2P',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -200px,#1c5a33 0%,var(--bg) 60%) fixed;
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
    min-height:100vh;
  }
  .app{max-width:720px;margin:0 auto;padding:0 16px;position:relative;z-index:1}
  .demo-banner{background:linear-gradient(145deg,#ffd23f,var(--gold-d));color:#2a1706;
    font-weight:800;text-align:center;border-radius:10px;padding:9px 12px;margin:12px 0 0;
    font-size:14px;letter-spacing:.5px;text-transform:uppercase;box-shadow:3px 3px 0 rgba(0,0,0,.4)}

  body.demo{
    --bg:#0a1024; --bg2:#122140; --card:#122140; --card2:#1b3160; --line:#2f4f8f;
    --txt:#ffffff; --muted:#aac2ea;
    --gold:#febe10; --gold-d:#d19a00; --burgundy:#00529f; --purple:#5b8ad6;
    background:radial-gradient(1200px 600px at 50% -200px,#123a7a 0%,var(--bg) 60%) fixed;
  }
  body.demo .music-btn,body.demo .tabs{background:#16294d}
  body.demo input,body.demo select,body.demo textarea,
  body.demo .tile,body.demo .podium-item{background:#0c1830}
  body.demo .tabs,body.demo .card,body.demo input,body.demo select,
  body.demo textarea,body.demo .face-preview{border-color:#081326}
  body.demo pre.rules{background:#0c1830}
  body.demo .assign-row,body.demo .comment,body.demo .goal-row,
  body.demo .log-row,body.demo .rank-row,body.demo details.help,
  body.demo .table td{border-color:rgba(255,255,255,.09)}

  /* Canchita 8-bit de fondo */
  #pitch-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.38}
  #pitch-bg svg{width:100%;height:100%;display:block}
  #pitch-bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%,transparent 30%,rgba(21,10,14,.55) 100%)}

  /* Header */
  .app-header{padding:22px 0 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;column-gap:10px;row-gap:8px}
  .brand{flex:1 1 170px;min-width:0}
  .music-btn{background:#330f1c;border:1px solid var(--line);color:var(--gold);
    border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:13px;transition:.15s;white-space:nowrap}
  .music-btn.playing{background:linear-gradient(145deg,#ffd23f,var(--gold-d));color:#2a1706;border-color:var(--gold)}
  .header-btns{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}
  .header-btns .music-btn{padding:10px 10px;font-size:12px}
  @media (max-width:430px){
    .brand h1{font-size:10px}
    .brand p{font-size:13px}
    .header-btns .music-btn{padding:9px 8px;font-size:11px}
  }
  .brand{display:flex;align-items:center;gap:12px}
  .crest{width:52px;height:58px;flex:0 0 auto;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  .brand h1{margin:0;font-size:19px;letter-spacing:.3px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}

  /* Tabs */
  .tabs{display:flex;gap:6px;background:#330f1c;border:1px solid var(--line);
    border-radius:14px;padding:5px;margin-bottom:18px}
  .tabs button{
    flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;
    font-size:13px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:.15s;
  }
  .tabs button.active{background:var(--card2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.25)}

  /* Sections */
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
  .section-head h2{margin:0;font-size:17px}
  h3{margin:0 0 14px;font-size:16px}

  /* Buttons */
  .btn{border:0;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:700;
    cursor:pointer;transition:.15s;font-family:inherit}
  .btn.primary{background:linear-gradient(145deg,#ffd23f,var(--gold-d));color:#2a1706;
    box-shadow:0 4px 14px rgba(242,183,5,.25)}
  .btn.primary:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #5a2028}
  .btn.sm{padding:8px 12px;font-size:13px}
  .btn.block{width:100%}
  .icon-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:12px}
  .match-card{cursor:pointer;transition:.15s}
  .match-card:active{transform:scale(.99)}
  .match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .date{font-size:12px;color:var(--muted);font-weight:600}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .tag.mvp{background:rgba(106,44,145,.28);color:#d9b6ef}
  .tag.hachazo{background:rgba(229,72,77,.2);color:#ff9a9d}
  .tag.polemica{background:rgba(242,183,5,.18);color:var(--gold)}
  .tag.gk{background:rgba(31,155,209,.22);color:#9fd8f5}
  .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .match-title{font-size:15px;font-weight:700;margin-bottom:10px}
  .score{display:flex;align-items:center;justify-content:center;gap:14px;
    font-size:30px;font-weight:800}
  .score span{color:var(--muted);font-size:20px}

  /* Scoreboard in detail */
  .board{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 8px}
  .board .team{flex:1;text-align:center}
  .board .team .nm{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board .team .go{font-size:42px;font-weight:800;line-height:1}
  .board .vs{color:var(--muted);font-weight:700}

  /* Forms */
  label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
  input,select{width:100%;margin-top:6px;background:#320d18;border:1px solid var(--line);
    color:var(--txt);border-radius:11px;padding:12px;font-size:15px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-weight:400;font-size:11px}
  .check{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--muted);font-weight:600;margin-bottom:12px;cursor:pointer}
  input[type=checkbox]{width:auto;margin:0;accent-color:var(--gold);transform:scale(1.25)}

  /* Assign rows */
  .assign-row{display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;border-bottom:1px solid rgba(74,33,48,.55)}
  .assign-row:last-child{border-bottom:0}
  .assign-row .pname{font-size:14px;display:flex;align-items:center;gap:6px}
  .num{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;
    background:var(--card2);border-radius:7px;font-size:11px;color:var(--muted)}
  .pixel-avatar{border-radius:5px;border:1px solid var(--line);flex:0 0 auto;display:block}

  /* Editor de cara */
  .face-editor{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .face-preview{display:flex;justify-content:center;position:sticky;-webkit-position:sticky;
    top:0;z-index:6;background:var(--card);padding:12px 0;margin:0 0 8px;
    border-bottom:3px solid #240a12;box-shadow:0 6px 10px -6px rgba(0,0,0,.6)}
  .face-preview svg{height:84px;width:auto;background:transparent}
  .face-controls{display:flex;flex-direction:column;gap:8px}
  .face-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .face-lbl{font-size:12px;color:var(--muted);width:62px;flex:0 0 auto;font-weight:700}
  .swatch{width:26px;height:26px;border-radius:6px;border:2px solid rgba(0,0,0,.45);cursor:pointer;padding:0}
  .swatch.on{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
  .face-pill{background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:8px;
    padding:5px 10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .face-pill.on{background:var(--gold);border-color:var(--gold);color:#2a1706}
  .face-group{border:2px solid var(--line);border-radius:10px;padding:6px 10px}
  .face-group>summary{cursor:pointer;font-weight:800;font-size:13px;color:var(--gold);list-style:none;
    display:flex;align-items:center;gap:6px;padding:2px 0}
  .face-group>summary::-webkit-details-marker{display:none}
  .face-group>summary::before{content:'▸';color:var(--muted);font-size:11px}
  .face-group[open]>summary::before{content:'▾'}
  .face-group .face-row{margin-top:10px}
  .face-row.scroll{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;gap:8px}
  .face-row.pos-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;align-items:center;gap:8px}
  .face-row.pos-row .face-lbl{width:auto;font-size:12px;padding-right:8px;white-space:nowrap}
  .face-row.pos-row .face-pill{padding:6px 11px;font-size:13px;border-radius:9px}
  .face-row.opt-row{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;gap:8px}
  .face-row.opt-row .face-lbl{width:auto;font-size:12px;padding-right:8px;white-space:nowrap}
  .face-row.opt-row .face-pill{padding:6px 11px;font-size:13px;border-radius:9px}

  /* Nube */
  .cloud-line{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .dot-ok{background:#5fd35f}
  .dot-sync{background:var(--gold)}
  .dot-local{background:var(--gold)}
  .dot-off{background:#9fd3ac}
  .dot-err{background:var(--red)}
  .dot-idle{background:var(--muted)}
  textarea{width:100%;margin-top:6px;background:#320d18;border:2px solid #240a12;color:var(--txt);
    border-radius:8px;padding:12px;font-size:15px;font-family:var(--font-body);resize:vertical}
  pre.rules{background:#0a1a10;border:1px solid var(--line);border-radius:8px;padding:10px;
    font-size:11px;line-height:1.5;overflow-x:auto;color:#bfe08a;white-space:pre}
  .side-btns{display:flex;gap:6px}
  .sidebtn{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .sidebtn.on{background:var(--gold);border-color:var(--gold);color:#2a1706}
  .row-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  .award-btns{display:flex;gap:2px}
  .award-btn{background:transparent;border:1px solid var(--line);border-radius:8px;padding:2px 4px;
    font-size:15px;line-height:1;cursor:pointer;filter:grayscale(1) opacity(.45)}
  .award-btn.on{filter:none;background:rgba(242,183,5,.2);border-color:var(--gold)}
  .assign-row .pname{flex:1 1 auto;min-width:0}
  .assign-row .pname .nm-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Goals */
  .goal-row{display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(74,33,48,.55)}
  .goal-row:last-child{border-bottom:0}
  .goal-side{font-size:11px;font-weight:700;color:var(--gold);background:rgba(242,183,5,.12);
    padding:3px 8px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .goal-main{flex:1;font-size:14px}
  .goal-main .as{color:var(--muted);font-size:12px}

  /* Table */
  .table{width:100%;border-collapse:collapse;font-size:13px}
  .table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;padding:8px 5px;border-bottom:1px solid var(--line)}
  .table td{padding:9px 5px;border-bottom:1px solid rgba(74,33,48,.45)}
  .table th.c,.table td.c{text-align:center;width:30px;padding-left:2px;padding-right:2px}
  .table th.c{font-size:9px;letter-spacing:.2px}
  .table tr:first-child td .rk{color:var(--gold)}
  .rk{font-weight:800;color:var(--muted);font-size:12px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-wrap .table{min-width:560px}

  /* Ranking */
  .cat-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .cat-pill{background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:20px;
    padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .cat-pill.on{background:var(--gold);border-color:var(--gold);color:#2a1706}
  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;align-items:end}
  .podium-item{background:#320d18;border:2px solid var(--line);border-radius:12px;padding:10px 6px;
    text-align:center;position:relative}
  .podium-item.p1{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,183,5,.25)}
  .podium-item.p2{border-color:#cfd8dc}
  .podium-item.p3{border-color:#c98a4b}
  .podium-item .medal{position:absolute;top:6px;left:7px;font-weight:800;font-size:12px;color:var(--muted)}
  .podium-item .pixel-avatar{margin:6px auto 0;width:48px;height:48px}
  .podium-item .pod-icon{position:absolute;line-height:1;font-size:20px;z-index:2;pointer-events:none;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.55))}
  .podium-item .pod-mvp{top:1px;left:50%;transform:translateX(-50%)}
  .podium-item .pod-d{top:1px;left:50%;transform:translateX(-50%);font-size:22px}
  .podium-item .pod-hachazos{top:42px;left:calc(50% - 32px);transform:rotate(18deg);font-size:24px}
  .podium-item .pod-polemicas{top:42px;left:calc(50% + 7px);transform:rotate(42deg);font-size:20px;
    filter:hue-rotate(-55deg) saturate(1.8) drop-shadow(0 2px 2px rgba(0,0,0,.55))}
  .podium-name{display:block;font-size:12px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .podium-val{display:block;font-size:22px;font-weight:800;color:var(--gold);line-height:1.1}
  .podium-cat{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
  .podium-wrap{display:flex;gap:10px;flex-wrap:wrap;align-items:stretch;margin-bottom:12px}
  .podium-wrap .podium{flex:1 1 210px;margin-bottom:0}
  .cat-help{flex:1 1 150px;background:rgba(242,183,5,.08);border:2px solid var(--line);border-radius:12px;
    padding:10px 12px;font-size:12px;line-height:1.45;color:var(--muted);display:flex;align-items:center}
  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(74,33,48,.55)}
  .rank-row:last-child{border-bottom:0}
  .rank-pos{width:24px;text-align:center;font-weight:800;color:var(--muted);font-size:13px;flex:0 0 auto}
  .rank-name{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-sub{color:var(--muted);font-size:11px}
  .rank-val{font-weight:800;font-size:18px;color:var(--gold)}

  /* Post-partido: escabio + comentarios */
  .esc-ctrl{display:flex;align-items:center;gap:8px}
  .guest-add{display:flex;gap:6px;margin-bottom:12px}
  .guest-add input{flex:1;margin-top:0}
  .esc-val{min-width:24px;text-align:center;font-weight:800;font-size:17px;color:var(--gold)}
  .escabio-total{display:flex;align-items:baseline;gap:8px;margin:4px 0 4px}
  .name-line{display:flex;align-items:center;gap:8px;margin-top:6px}
  .name-line input{margin-top:0;flex:1}
  .name-face{flex:0 0 auto;display:flex}
  .comment-head .pixel-avatar{flex:0 0 auto}
  .comment{border-bottom:1px solid rgba(74,33,48,.55);padding:8px 0}
  .comment:last-child{border-bottom:0}
  .comment-head{display:flex;align-items:center;gap:8px}
  .comment-head b{font-size:14px}
  .comment-time{font-size:11px;color:var(--muted);flex:1}
  .comment-head .icon-btn{margin-left:auto}
  .comment-text{margin:4px 0 0;font-size:15px;word-break:break-word;white-space:pre-wrap}

  /* Ayuda */
  details.help{border-bottom:1px solid rgba(74,33,48,.55);padding:9px 0}
  details.help:last-child{border-bottom:0}
  details.help summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}
  details.help summary::-webkit-details-marker{display:none}
  details.help summary::before{content:"\25B8  ";color:var(--gold)}
  details.help[open] summary::before{content:"\25BE  "}
  details.help p{margin:6px 0 0;font-size:14px;line-height:1.5}
  .clickable{cursor:pointer}
  .win{color:#bfe08a}
  .loss{color:#ff9a9d}
  .gold{color:var(--gold)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:var(--card2);color:var(--muted);white-space:nowrap}
  .pill.win{background:rgba(139,195,74,.18);color:#bfe08a}
  .pill.loss{background:rgba(255,90,95,.16);color:#ff9a9d}
  .pill.gold{background:rgba(242,183,5,.16);color:var(--gold)}

  /* Resumen ganador/perdedor */
  .summary{display:flex;gap:12px}
  .summary .sum-item{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
  .summary .sum-item+.sum-item{border-left:1px solid var(--line);padding-left:12px}
  .sum-item .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .sum-item .val{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
  .sum-item .val b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Ficha de jugador */
  .profile-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .profile-top h2{margin:0;font-size:20px}
  .profile-top p{margin:3px 0 0;font-size:12px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{background:#320d18;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
  .tile-num{display:block;font-size:20px;font-weight:800;line-height:1.15}
  .tile-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700}
  .streak-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;
    background:linear-gradient(145deg,rgba(242,183,5,.14),rgba(242,183,5,.04));
    border:2px solid var(--gold);border-radius:12px;padding:12px 6px;text-align:center}
  .streak-item{display:flex;flex-direction:column;gap:2px;min-width:0}
  .streak-item + .streak-item{border-left:1px solid rgba(242,183,5,.3)}
  .streak-num{font-size:26px;font-weight:800;color:var(--gold);line-height:1.1}
  .streak-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700}
  .log-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(74,33,48,.55)}
  .log-row:last-child{border-bottom:0}
  .res{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:12px;font-weight:800}
  .res.win{background:rgba(139,195,74,.2);color:#bfe08a}
  .res.loss{background:rgba(255,90,95,.18);color:#ff9a9d}
  .res.draw{background:var(--card2);color:var(--muted)}

/* ---------- Modo demo (datos de ejemplo, sin nube) ---------- */
function demoRand(seed){
  return function(){
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function demoSeed(){
  const rnd = demoRand(20260924);
  const ri = n => Math.floor(rnd()*n);
  const pick = a => a[ri(a.length)];
  const shuffled = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=ri(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; };

  const roster = [
    ['Juan Pérez','Tuti','10',['MCO','MC']],
    ['Sofía Ramírez','Sofi','7',['DC','SD']],
    ['Nico Fernández','Nico','1',['PO']],
    ['Camila Duarte','Cami','4',['DFC','MCD']],
    ['Diego Sosa','Diegui','2',['LT','CAI']],
    ['Valentina Ríos','Vale','5',['MC','MCD']],
    ['Fede Acuña','Fede','9',['DC','PT']],
    ['Martina López','Martu','8',['MD','MCO']],
    ['Santi Vera','Santi','3',['LD','DFC']],
    ['Julieta Benítez','Juli','11',['EI','ED']],
    ['Gonza Ruiz','Gonza','6',['MCD','DFC']],
    ['Agustina Pereyra','Agus','14',['MI','MC']]
  ];
  const players = roster.map(([name,nickname,number,positions],i)=>({
    id:'demo_p'+i, name, nickname, number, positions, guest:false, face: randomFace()
  }));
  players.push({ id:'demo_guest', name:'Rocío (invitada)', nickname:'Rocío', number:'', positions:['MC'], guest:true, face: randomFace() });

  const teamNames = ['Equipo Negro','Equipo Rojo','Equipo Verde','Equipo Azul','Equipo Blanco','Equipo Violeta'];
  const rivals = ['Los Guapos FC','Barrio Sur FC','Deportivo Resaca','Los Pibes'];
  const commentsPool = [
    ['Tuti','Gran partido, la rompimos.'],
    ['Sofi','El segundo tiempo fue nuestro.'],
    ['Diegui','Faltó puntería, pero ganamos.'],
    ['Cami','Ese gol de media cancha fue una locura.'],
    ['Santi','Arrancamos dormidos y lo dimos vuelta.'],
    ['Martu','MVP merecido.'],
    ['Vale','Hay que mejorar la marca en el mediocampo.'],
    ['Agus','Buen finde de fútbol, se festeja.']
  ];

  const matches = [];
  const today = new Date();
  for(let i=0;i<7;i++){
    const d = new Date(today.getTime() - i*7*86400000);
    const date = d.toISOString().slice(0,10);
    const isRival = (i % 3 === 2);
    const m = { id:'demo_m'+i, date, mode: isRival?'rival':'interno', teamA:[], teamB:[], events:[],
                mvpId:null, gkId:null, hachazoId:null, polemicaId:null, escabio:{}, comments:[] };
    const pool = shuffled(players.filter(p=>!p.guest).map(p=>p.id)).slice(0, isRival?10:12);
    if(isRival){
      m.teamAName = 'Fulbito FC';
      m.teamBName = pick(rivals);
      m.rivalName = m.teamBName;
      m.teamA = pool;
    } else {
      m.teamAName = pick(teamNames);
      m.teamBName = pick(teamNames.filter(n=>n!==m.teamAName));
      const half = Math.ceil(pool.length/2);
      m.teamA = pool.slice(0,half);
      m.teamB = pool.slice(half);
    }
    const all = isRival ? m.teamA : [...m.teamA, ...m.teamB];
    const totalGoals = 2 + ri(6);
    for(let g=0; g<totalGoals; g++){
      if(isRival && rnd() < 0.5){
        m.events.push({ id:'demo_m'+i+'_e'+g, side:'B', scorerId:'', assistId:'' });
      } else {
        const rosterSide = (isRival || rnd() < 0.5) ? m.teamA : m.teamB;
        const side = rosterSide === m.teamA ? 'A' : 'B';
        const scorerId = pick(rosterSide);
        const others = rosterSide.filter(x=>x!==scorerId);
        const assistId = (others.length && rnd()<0.55) ? pick(others) : '';
        m.events.push({ id:'demo_m'+i+'_e'+g, side, scorerId, assistId });
      }
    }
    const scorers = m.events.filter(e=>e.scorerId).map(e=>e.scorerId);
    m.mvpId = scorers.length ? pick(scorers) : pick(m.teamA);
    const gks = all.filter(id=>{ const p = players.find(x=>x.id===id); return p && p.positions.includes('PO'); });
    if(gks.length) m.gkId = pick(gks);
    if(all.length){ m.hachazoId = pick(all); m.polemicaId = pick(all); }
    all.forEach(id=>{ const q = ri(3); if(q>0) m.escabio[id] = q; });
    const nc = ri(3);
    for(let c=0;c<nc;c++){ const [author,text] = pick(commentsPool); m.comments.push({ id:'demo_m'+i+'_c'+c, author, text, ts: d.getTime() + (c+1)*3600000 }); }
    matches.push(m);
  }
  return { players, matches };
}

/* ---------- Nube (Firebase / Firestore) ---------- */
const FBCFG_KEY = 'pielmorenafc_fbconfig';
const DEFAULT_FB_CONFIG = {
  apiKey: "AIzaSyCwWiw-_4CSzSv5jXeHYd9eHwzOoUrssOQ",
  authDomain: "piel-morena-fc.firebaseapp.com",
  projectId: "piel-morena-fc",
  storageBucket: "piel-morena-fc.firebasestorage.app",
  messagingSenderId: "198605126708",
  appId: "1:198605126708:web:d3c0f2de78e18041e01e61"
};
let fbConfig = loadFbConfig();
let db = null;
let cloudStarted = false;
let cloudStarting = false;
let cloudState = { status:'unset', message:'' };

function loadFbConfig(){
  try{ const c = JSON.parse(localStorage.getItem(FBCFG_KEY)); if(c && c.projectId) return c; }catch(e){}
  return DEFAULT_FB_CONFIG;
}
function cloudConfigured(){ return DEMO ? false : !!fbConfig; }
function fsReady(){ return !!db; }

function parseFbConfig(text){
  let s = String(text||'').trim();
  s = s.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/, '').replace(/;\s*$/, '');
  const obj = new Function('return (' + s + ');')();
  if(!obj || !obj.projectId) throw new Error('falta projectId');
  return obj;
}
function saveFbConfig(){
  if(DEMO) return;
  const el = document.getElementById('fb-config');
  try{
    fbConfig = parseFbConfig(el ? el.value : '');
    localStorage.setItem(FBCFG_KEY, JSON.stringify(fbConfig));
    cloudStarted = false; db = null;
    initCloud(); render();
  }catch(e){ alert('No pude leer la config: ' + e.message); }
}
function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = ()=>rej(new Error('No cargó ' + src));
    document.head.appendChild(s);
  });
}
async function ensureFirebase(){
  if(typeof firebase !== 'undefined') return true;
  if(!window.__fbLoading){
    window.__fbLoading = (async()=>{
      await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js');
    })();
  }
  try{ await window.__fbLoading; return typeof firebase !== 'undefined'; }
  catch(e){ window.__fbLoading = null; return false; }
}
async function initCloud(){
  if(!cloudConfigured()){ cloudState = { status:'unset', message:'' }; renderCloudStatus(); return; }
  if(cloudStarted || cloudStarting) return;
  cloudStarting = true;
  cloudState = { status:'syncing', message:'Conectando...' }; renderCloudStatus();
  const ok = await ensureFirebase();
  if(!ok){
    cloudStarting = false;
    cloudState = { status:'error', message:'No se pudo cargar Firebase (revisá la conexión).' };
    renderCloudStatus(); return;
  }
  try{
    firebase.initializeApp(fbConfig);
    db = firebase.firestore();
    cloudStarted = true;

    if(firebase.auth){
      auth = firebase.auth();
      auth.onAuthStateChanged(u=>{
        currentUser = u || null;
        isAdmin = isAdminEmail(currentUser);
        render();
      });
    }

    db.collection('players').onSnapshot(snap=>{
      data.players = snap.docs.map(d=>d.data());
      afterSnapshot();
    }, err=>cloudFail(err));

    db.collection('matches').onSnapshot(snap=>{
      data.matches = snap.docs.map(d=>d.data());
      afterSnapshot();
    }, err=>cloudFail(err));

    db.collection('backups').onSnapshot(snap=>{
      backups = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
      backupsLoaded = true; backupsBlocked = false;
      afterSnapshot();
    }, ()=>{ backupsLoaded = true; backupsBlocked = true; render(); });
  }catch(e){
    cloudState = { status:'error', message:'Error al iniciar Firebase: ' + e.message };
    renderCloudStatus();
  }
  cloudStarting = false;
}
function afterSnapshot(){
  localStorage.setItem(KEY, JSON.stringify(data));
  autoCloseOldMatches();
  if(cloudState.status !== 'error') cloudState = { status:'ok', message:'Sincronizado en tiempo real.' };
  maybeAutoBackup();
  render();
}

function persistPlayer(p){ if(fsReady()) db.collection('players').doc(p.id).set(p).catch(e=>cloudFail(e)); }
function removePlayerDoc(id){ if(fsReady()) db.collection('players').doc(id).delete().catch(e=>cloudFail(e)); }
function persistMatch(m){ if(fsReady()) db.collection('matches').doc(m.id).set(m).catch(e=>cloudFail(e)); }
function persistComments(m){ if(fsReady()) db.collection('matches').doc(m.id).update({ comments: m.comments || [] }).catch(e=>cloudFail(e)); }
function removeMatchDoc(id){ if(fsReady()) db.collection('matches').doc(id).delete().catch(e=>cloudFail(e)); }
function cloudFail(e){ cloudState = { status:'error', message:'Error: ' + (e && e.message ? e.message : e) }; renderCloudStatus(); }

/* ---------- Sesión de administrador (Google) ---------- */
function adminLogin(){
  if(!cloudConfigured()){ alert('Primero conectá la nube.'); return; }
  ensureFirebase().then(()=>{
    if(typeof firebase === 'undefined'){ alert('No se pudo cargar Firebase.'); return; }
    if(!firebase.apps || !firebase.apps.length) firebase.initializeApp(fbConfig);
    if(!auth) auth = firebase.auth();
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e=>alert('No se pudo iniciar sesión: ' + (e && e.message ? e.message : e)));
  });
}
function adminLogout(){ if(auth) auth.signOut(); }
function adminHTML(){
  if(!cloudConfigured()) return '';
  let inner;
  if(currentUser){
    const who = esc(currentUser.email || currentUser.displayName || '');
    inner = `<p class="muted" style="margin:6px 0">Sesión: <b>${who}</b>${isAdmin?' <span class="tag mvp">admin</span>':' <span class="hint">(sin permisos de admin)</span>'}</p>
      <button class="btn ghost sm" data-action="admin-logout">Salir</button>`;
  } else {
    inner = `<button class="btn ghost sm" data-action="admin-login">Entrar como admin</button>`;
  }
  return `<h3 style="margin-top:16px">Administrador</h3>${inner}`;
}

/* ---------- Backups (copia semanal en la nube) ---------- */
let backups = [];
let backupsLoaded = false;
let backupsBlocked = false;
let autoBackupTried = false;
function backupWeekKey(){
  const d = new Date();
  const diff = (d.getDay() - 3 + 7) % 7;          // dias desde el ultimo miercoles
  const t = new Date(d.getTime() - diff*86400000);
  const m = String(t.getMonth()+1).padStart(2,'0'), dd = String(t.getDate()).padStart(2,'0');
  return `${t.getFullYear()}-${m}-${dd}`;
}
function createBackup(kind){
  if(!fsReady() || backupsBlocked) return;
  const week = backupWeekKey();
  const rec = { week, ts: Date.now(), kind: kind||'auto', players: data.players, matches: data.matches };
  db.collection('backups').doc(week).set(rec)
    .then(()=>{ cloudState = { status:'ok', message:'Backup '+fmtDate(week)+' guardado.' }; renderCloudStatus(); pruneBackups(); })
    .catch(()=>{ backupsBlocked = true; render(); });
}
function pruneBackups(){
  if(!fsReady()) return;
  db.collection('backups').get().then(snap=>{
    const docs = snap.docs.slice().sort((a,b)=> String(b.data().week||'').localeCompare(String(a.data().week||'')));
    docs.slice(8).forEach(d=>db.collection('backups').doc(d.id).delete().catch(()=>{}));
  }).catch(()=>{});
}
function maybeAutoBackup(){
  if(autoBackupTried || !fsReady() || !backupsLoaded || backupsBlocked) return;
  if(!data.players.length && !data.matches.length) return;
  autoBackupTried = true;
  const week = backupWeekKey();
  if(backups.some(b=>b.week===week)) return;
  createBackup('auto');
}
function downloadBackup(id){
  const b = backups.find(x=>x.id===id); if(!b) return;
  const payload = { app:'piel-morena-fc', version:1, exportedAt:new Date().toISOString(), players:b.players||[], matches:b.matches||[] };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='backup-'+b.week+'.json'; a.click();
  URL.revokeObjectURL(url);
}
function restoreBackup(id){
  const b = backups.find(x=>x.id===id); if(!b) return;
  if(!confirm('¿Restaurar el backup del '+fmtDate(b.week)+'? Se reemplazan los datos actuales en todos los dispositivos.')) return;
  const players = b.players||[], matches = b.matches||[];
  data.players = players; data.matches = matches; save(); render();
  if(fsReady()){
    const overwrite = (name, arr) => db.collection(name).get().then(snap=>{
      const dels = snap.docs.map(d=>db.collection(name).doc(d.id).delete());
      return Promise.all(dels).then(()=>Promise.all(arr.map(o=>db.collection(name).doc(o.id).set(o))));
    });
    overwrite('players', players).then(()=>overwrite('matches', matches))
      .then(()=>{ cloudState = { status:'ok', message:'Backup del '+fmtDate(b.week)+' restaurado.' }; renderCloudStatus(); })
      .catch(e=>cloudFail(e));
  }
}
function backupsHTML(){
  if(!cloudConfigured()) return '';
  if(backupsBlocked) return `<h3 style="margin-top:16px">Backups en la nube</h3>
    <p class="muted" style="color:#ff9a9d">Falta habilitar la colección <b>backups</b> en las reglas de Firestore (no afecta a tus datos). Agregá esta línea y publicá:</p>
    <pre class="rules">match /backups/{id} { allow read, write: if true; }</pre>`;
  const list = backups.slice().sort((a,b)=> String(b.week||'').localeCompare(String(a.week||'')));
  const rows = list.map(b=>`<div class="assign-row">
      <span class="pname">${fmtDate(b.week)} <span class="muted">· ${(b.players||[]).length} jug · ${(b.matches||[]).length} part · ${b.kind==='manual'?'manual':'auto'}</span></span>

        <button class="sidebtn" data-action="bk-download" data-id="${b.id}">Descargar</button>
        <button class="sidebtn" data-action="bk-restore" data-id="${b.id}">Restaurar</button>
      </span>

  return `<h3 style="margin-top:16px">Backups en la nube <span class="hint">· automático los miércoles</span></h3>
    <p class="muted">Se guarda una copia cada miércoles (después del partido del martes). Se conservan las últimas 8 semanas. Podés descargar o restaurar cualquiera.</p>
    <div class="toolbar" style="margin-bottom:8px"><button class="btn ghost sm" data-action="bk-now">Backup ahora</button></div>

}

/* ---------- Avatar pixel art (16-bit) ---------- */
function hashStr(s){
  let h = 2166136261 >>> 0;
  for(const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r = Math.min(255, Math.max(0, Math.round(((n>>16)&255)*f)));
  const g = Math.min(255, Math.max(0, Math.round(((n>>8)&255)*f)));
  const b = Math.min(255, Math.max(0, Math.round((n&255)*f)));
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}
const AV_SKIN  = ['#f1c9a5','#e8b98f','#dda96f','#c68642','#a9713f','#8d5524','#7a4a22','#6b3d1c','#57301a','#3d2110'];
const AV_HAIR  = ['#161616','#2e2119','#4a2f1b','#8a5a2b','#d9a441','#e8c874','#b5481f','#7a2f18','#cfcfcf','#8f8f8f'];
const AV_SHIRT = ['#7d2233','#f2b705','#6a2c91','#8bc34a','#f3ead6','#b5703c','#1f9bd1','#e5484d','#1b3a8c','#6fc0e8','#111111','#ffffff'];
const AV_STYLE   = [['Corto',0],['Medio',1],['Largo',2],['Pelado',3],['Rulos',4],['Cresta',5],['Colita',6]];
const AV_EYES    = [['Normal',0],['Guiño',1],['Sonrisa',2],['Enojado',3],['Sorpresa',4]];
const AV_EYESIZE = [['Chicos',0],['Medianos',1],['Grandes',2],['Redondos',3],['Achinados',4],['Altos',5]];
const AV_FACIAL  = [['Nada',0],['Barba',1],['Bigote',2],['Candado',3],['Completa',4]];
const AV_HAT     = [['Nada',0],['Gorra',1],['Vincha',2],['Gorro',3]];
const AV_GLASSES = [['Nada',0],['Redondos',1],['Cuadrados',2],['De sol',3],['Parche',4]];
const AV_JERSEY  = [['Lisa',0],['Rayas',1],['Banda',2],['Franja',3],['Mitades',4],['Mangas',5]];
function randomFace(){
  return {
    skin: Math.floor(Math.random()*AV_SKIN.length),
    hair: Math.floor(Math.random()*AV_HAIR.length),
    shirt: Math.floor(Math.random()*AV_SHIRT.length),
    shirt2: Math.floor(Math.random()*AV_SHIRT.length),
    style: Math.floor(Math.random()*AV_STYLE.length),
    eyes: Math.floor(Math.random()*AV_EYES.length),
    eyeSize: 1 + Math.floor(Math.random()*(AV_EYESIZE.length-1)),
    facial: Math.random() < 0.4 ? 1 + Math.floor(Math.random()*4) : 0,
    hat: Math.random() < 0.25 ? 1 + Math.floor(Math.random()*3) : 0,
    hatColor: Math.floor(Math.random()*AV_SHIRT.length),
    glasses: Math.random() < 0.18 ? 1 + Math.floor(Math.random()*3) : 0,
    jersey: Math.floor(Math.random()*AV_JERSEY.length)
  };
}
function avatarSVG(seed, size, face, view){
  size = size || 40;
  const bust = view === 'bust';
  const h = hashStr(seed);
  const f = face || {};
  const W = 24, H = 32;
  const g = Array.from({length:H}, () => Array(W).fill('.'));
  const pick = (v,k) => v != null ? v : (h >>> k);
  const SKIN   = AV_SKIN[pick(f.skin, 3)   % AV_SKIN.length];
  const HAIR   = AV_HAIR[pick(f.hair, 7)   % AV_HAIR.length];
  const SHIRT  = AV_SHIRT[pick(f.shirt, 11) % AV_SHIRT.length];
  const SHIRT2 = AV_SHIRT[f.shirt2 != null ? f.shirt2 % AV_SHIRT.length : (f.shirt != null ? (f.shirt+5) % AV_SHIRT.length : (h >>> 13) % AV_SHIRT.length)];
  const HATCOL = AV_SHIRT[pick(f.hatColor, 19) % AV_SHIRT.length];
  const style   = f.style   != null ? f.style   : (h >>> 15) % AV_STYLE.length;
  const eyes    = f.eyes    != null ? f.eyes    : 0;
  const eyeSize = f.eyeSize != null ? f.eyeSize : 2;
  const facial  = f.facial  != null ? f.facial  : (f.beard ? 1 : 0);
  const hat     = f.hat     != null ? f.hat     : 0;
  const glasses = f.glasses != null ? f.glasses : 0;
  const jersey  = f.jersey  != null ? f.jersey  : 0;
  const turn = !bust;          // cuerpo: leve diagonal; carnet: de frente
  const fx = turn ? 1 : 0;     // corrimiento 3/4 de la cara

  const put = (x,y,c)=>{ if(x>=0&&x<W&&y>=0&&y<H&&c!==undefined) g[y][x]=c; };
  const inEll = (x,y,cx,cy,rx,ry)=>((x-cx)/rx)**2+((y-cy)/ry)**2<=1;
  const rect = (x0,y0,x1,y1,c)=>{ for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++) put(x,y,c); };

  // ---------- cabeza ----------
  const HCX = 12, HCY = 8.4, HRX = 7.3, HRY = 7.7;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++)
    if(inEll(x,y,HCX,HCY,HRX,HRY)) put(x,y, x>=16?'d':(x<=8?'L':'S'));
  for(let x=9;x<=15;x++) if(inEll(x,15,HCX,HCY,HRX,HRY)) put(x,15,'d');
  if(turn){ put(4,11,'d'); put(4,12,'S'); put(3,12,'d'); }

  // ---------- pelo ----------
  const cap=(yLim,exp=0.5)=>{ for(let y=0;y<=yLim;y++) for(let x=0;x<W;x++) if(inEll(x,y,HCX,HCY,HRX+exp,HRY+exp)) put(x,y,'H'); };
  if(style===0){ cap(4); for(let y=4;y<=11;y++){ if(inEll(4,y)) put(4,y,'H'); if(inEll(19,y)) put(19,y,'H'); } }
  else if(style===1){ cap(5.5); for(let y=4;y<=13;y++){ if(inEll(4,y)) put(4,y,'H'); if(inEll(19,y)) put(19,y,'H'); } }
  else if(style===2){ cap(6.5); for(let y=4;y<=17;y++){ put(3,y,'H'); put(20,y,'H'); } for(let y=6;y<=11;y++){ put(2,y,'H'); put(21,y,'H'); } }
  else if(style===3){ /* pelado */ }
  else if(style===4){
    const curl=(cx,cy,r)=>{ for(let y=0;y<H;y++) for(let x=0;x<W;x++) if((x-cx)*(x-cx)+(y-cy)*(y-cy)<=r*r) put(x,y,'H'); };
    curl(6,8,3.0); curl(9,4.5,3.0); curl(13,4.0,3.0); curl(16,4.5,3.0); curl(19,8,3.0);
    curl(4,12,2.2); curl(21,12,2.2);
  }
  else if(style===5){ cap(2.0); for(let y=0;y<=7;y++){ put(11,y,'H'); put(12,y,'H'); put(13,y,'H'); } }
  else if(style===6){
    cap(4);
    for(let y=4;y<=12;y++){ if(inEll(4,y)) put(4,y,'H'); if(inEll(19,y)) put(19,y,'H'); }
    // colita pegada al costado de la cabeza
    for(let y=7;y<=13;y++) put(20,y,'H');
    put(20,6,'H'); put(20,14,'l');
  }
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(g[y][x]==='H' && (y===0||g[y-1][x]==='.')) g[y][x]='l';

  // ---------- rasgos ----------
  const brow=8, eye=10, nose=12, mouth=14;
  put(8+fx,brow,'B'); put(9+fx,brow,'B'); put(14+fx,brow,'B'); put(15+fx,brow,'B');
  if(eyes===3){ put(8+fx,brow,'d'); put(9+fx,brow,'d'); put(14+fx,brow,'d'); put(15+fx,brow,'d'); }
  // ojos segun tamaño/forma
  const Li = 10+fx, Ri = 14+fx;
  const drawEye = (inner, dir)=>{
    const q = (dx,dy,c)=>put(inner+dir*dx, eye+dy, c);
    if(eyeSize===0){ q(0,0,'P'); }                                              // chicos 1px
    else if(eyeSize===1){ q(0,0,'E'); q(1,0,'P'); }                             // 2x1 blanco+negro
    else if(eyeSize===2){ q(0,0,'P'); q(1,0,'P'); q(0,1,'P'); q(1,1,'P'); }     // 2x2 negro
    else if(eyeSize===3){ q(0,0,'E'); q(1,0,'P'); q(0,1,'P'); q(1,1,'P'); }     // redondo con brillo
    else if(eyeSize===4){ q(0,0,'P'); q(1,0,'P'); }                             // achinado
    else { q(0,0,'E'); q(1,0,'E'); q(0,1,'P'); q(1,1,'P'); }                    // grandes blanco+negro
  };
  drawEye(Li,-1); drawEye(Ri,1);
  if(eyes===1){ // guiño: cierra el ojo derecho
    for(let dx=0;dx<3;dx++) for(let dy=0;dy<2;dy++) put(Ri-dx, eye+dy, 'S');
    put(Ri,eye,'M'); put(Ri-1,eye,'M');
  }
  put(11+fx,nose,'d'); put(12+fx,nose,'d'); put(12+fx,nose+1,'d');
  if(eyes===2){ put(10+fx,mouth,'M'); put(11+fx,mouth,'Z'); put(12+fx,mouth,'Z'); put(13+fx,mouth,'M'); }
  else if(eyes===4){ put(11+fx,mouth,'Z'); put(12+fx,mouth,'Z'); }
  else { put(10+fx,mouth,'M'); put(11+fx,mouth,'M'); put(12+fx,mouth,'M'); put(13+fx,mouth,'M'); }

  // ---------- barba / bigote ----------
  if(facial===1||facial===4){ for(let x=8;x<=15;x++) if(g[15][x]!=='.') g[15][x]='h'; put(8+fx,14,'h'); put(15+fx,14,'h'); }
  if(facial===2||facial===4){ put(10+fx,13,'h'); put(11+fx,13,'h'); put(12+fx,13,'h'); put(13+fx,13,'h'); }
  if(facial===3){ put(11+fx,15,'h'); put(12+fx,15,'h'); }

  // ---------- gorra / vincha / gorro ----------
  const capFill=(y0,y1,c)=>{ for(let y=y0;y<=y1;y++) for(let x=0;x<W;x++) if(inEll(x,y,HCX,HCY,HRX+0.3,HRY+0.3)) put(x,y,c); };
  if(hat===1){ // gorra: copa + visera
    capFill(0,4,'W');
    for(let x=4;x<=19;x++) put(x,5,'w');
    put(3,5,'w'); put(20,5,'w');
    put(11,0,'w'); put(12,0,'w');
  } else if(hat===2){ // vincha: banda en la frente
    for(let x=0;x<W;x++){ if(g[6][x]!=='.') put(x,6,'W'); if(g[7][x]!=='.') put(x,7,'w'); }
  } else if(hat===3){ // gorro: copa + reborde doblado
    capFill(0,6,'W');
    for(let x=0;x<W;x++){ if(g[7][x]!=='.') put(x,7,'w'); if(g[8][x]!=='.') put(x,8,'w'); }
    put(11,0,'w'); put(12,0,'w');
  }

  // ---------- anteojos ----------
  const lens=(x0,x1,y0,y1)=>{ for(let y=y0;y<=y1;y++){ put(x0+fx,y,'g'); put(x1+fx,y,'g'); } for(let x=x0;x<=x1;x++){ put(x+fx,y0,'g'); put(x+fx,y1,'g'); } };
  if(glasses===1){ // redondos
    lens(8,11,9,12); lens(13,16,9,12);
    put(12+fx,10,'g');
    for(const x of [6,7,17,18]) put(x+fx,10,'g');
  } else if(glasses===2){ // cuadrados (mas anchos)
    lens(7,11,9,12); lens(13,17,9,12);
    put(12+fx,10,'g');
    for(const x of [5,6,18,19]) put(x+fx,10,'g');
  } else if(glasses===3){ // de sol (cristales oscuros)
    lens(8,11,9,12); lens(13,16,9,12);
    put(12+fx,10,'g');
    for(const x of [6,7,17,18]) put(x+fx,10,'g');
    for(let x=9;x<=10;x++) for(let y=10;y<=11;y++) put(x+fx,y,'Z');
    for(let x=14;x<=15;x++) for(let y=10;y<=11;y++) put(x+fx,y,'Z');
  } else if(glasses===4){ // parche en el ojo (con correa diagonal)
    for(let x=8;x<=10;x++) for(let y=9;y<=11;y++) put(x+fx,y,'g');
    for(let i=0;i<10;i++) put((10+i)+fx, 11 - Math.floor(i*0.6), 'g');
    put(7+fx,11,'g'); put(6+fx,12,'g');
  }

  // ---------- cuello ----------
  rect(10,16,13,17,'d');

  // ---------- torso ----------
  const pc=(x,y)=>{
    if(jersey===1) return (x%3===0)?'K':'C';
    if(jersey===2) return (Math.abs((x-12)-(y-18)*0.8)<1.6)?'K':'C';
    if(jersey===3) return (y===20)?'K':'C';
    if(jersey===4) return (x<=11)?'C':'K';
    return 'C';
  };
  for(let y=18;y<=24;y++){
    const x0 = 8 + (y>=23?1:0), x1 = 16 - (y>=23?1:0);
    for(let x=x0;x<=x1;x++) put(x,y, pc(x,y));
  }

  // mangas + brazos a los costados
  rect(6,18,7,20, jersey===5?'K':'c'); rect(17,18,18,20, jersey===5?'K':'c');
  rect(6,21,7,24,'S'); rect(17,21,18,24,'S');
  put(6,25,'S'); put(7,25,'S'); put(17,25,'S'); put(18,25,'S');

  // ---------- shorts ----------
  rect(7,25,17,27,'F');
  put(7,25,'f'); put(8,25,'f'); put(7,26,'f'); put(8,26,'f');

  // ---------- piernas y pies ----------
  rect(9,28,11,30,'S'); rect(13,28,15,30,'S');
  if(turn){ rect(8,31,11,31,'G'); rect(13,31,17,31,'G'); }
  else { rect(8,31,11,31,'G'); rect(13,31,16,31,'G'); }

  // ---------- contorno ----------
  const src = g.map(r => r.slice());
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    if(src[y][x] !== '.') continue;
    const nb = (src[y-1]?.[x]??'.') + (src[y+1]?.[x]??'.') + (src[y]?.[x-1]??'.') + (src[y]?.[x+1]??'.');
    if(nb.replace(/\./g,'') !== '') g[y][x] = 'o';
  }

  const colMap = {
    'H':HAIR, 'h':shade(HAIR,0.72), 'l':shade(HAIR,1.45), 'B':'#141210',
    'S':SKIN, 'd':shade(SKIN,0.78), 'L':shade(SKIN,1.13),
    'E':'#f4fbff', 'P':'#1a1a1a', 'Z':'#431f1f', 'M':shade(SKIN,0.5),
    'W':HATCOL, 'w':shade(HATCOL,0.7), 'g':'#20262b',
    'C':SHIRT, 'c':shade(SHIRT,0.78), 'K':SHIRT2, 'k':shade(SHIRT2,0.78),
    'F':'#ece7dd', 'f':'#c7c0b2', 'G':'#20242a',
    'o':'#08160d'
  };
  let rects = '';
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const v = g[y][x];
    if(v === '.' || !colMap[v]) continue;
    rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colMap[v]}"/>`;
  }
  const w = bust ? Math.round(size*18/20) : Math.round(size*W/H);
  const vb = bust ? '3 0 18 20' : '0 0 24 32';
  return `<svg class="pixel-avatar" width="${w}" height="${size}" viewBox="${vb}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" style="background:#0f2a19" aria-hidden="true">${rects}</svg>`;
}
function playerAvatar(p, size){ return avatarSVG(p.id, size, p.face); }
function playerAvatarBust(p, size){ return avatarSVG(p.id, size, p.face, 'bust'); }
function faceForName(name, size){
  const n = String(name||'').trim().toLowerCase();
  if(n){
    const p = data.players.find(x=> (x.name||'').toLowerCase()===n || (x.nickname||'').toLowerCase()===n)
           || data.players.find(x=> (x.nickname||'').toLowerCase() && n.indexOf((x.nickname||'').toLowerCase())===0)
           || data.players.find(x=> (x.name||'').toLowerCase() && (x.name||'').toLowerCase().indexOf(n)===0);
    if(p) return playerAvatarBust(p, size);
  }
  return avatarSVG('who:'+(name||'?'), size, null, 'bust');
}

/* ---------- Partidos ---------- */
function partidosHTML(){
  const ms = [...data.matches].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const head = `<div class="section-head"><h2>Partidos</h2>
    <button class="btn primary sm" data-action="new-match">+ Nuevo partido</button></div>`;
  if(!ms.length){
    return head + `<div class="empty"><span class="big">⚽</span>No hay partidos cargados todavía.<br>Tocá "Nuevo partido" para arrancar.</div>`;
  }
  const cards = ms.map(m=>{
    const a=scoreOf(m,'A'), b=scoreOf(m,'B');
    const title = m.rivalName ? `${esc(m.teamAName)} vs ${esc(m.rivalName)}`
                              : `${esc(m.teamAName)} vs ${esc(m.teamBName)}`;
    const _aM = awardId(m,'mvp'), _aG = awardId(m,'gk'), _aH = awardId(m,'hachazo'), _aP = awardId(m,'polemica');
    const mvp = _aM ? `<span class="tag mvp">👑 Figura: ${esc(pname(_aM))}</span>` : '';
    const gk = _aG ? `<span class="tag gk">🧤 Arquero: ${esc(pname(_aG))}</span>` : '';
    const hach = _aH ? `<span class="tag hachazo">🪓 Hachazo: ${esc(pname(_aH))}</span>` : '';
    const pol = _aP ? `<span class="tag polemica">📣 Polémica: ${esc(pname(_aP))}</span>` : '';
    return `<article class="card match-card" data-action="open-match" data-id="${m.id}">
      <div class="match-top"><span class="date">${fmtDate(m.date)}</span><span class="tags">${m.closed?'<span class="tag">🔒</span>':''}${mvp}${gk}${hach}${pol}</span></div>
      <div class="match-title">${title}</div>
      <div class="score"><b>${a}</b><span>-</span><b>${b}</b></div>
    </article>`;
  }).join('');
  return head + cards + escabioPostHTML();
}

/* ---------- Premios del partido (manuales: figura, arquero, hachazo, polémica) ---------- */
function awardId(m, cat){
  return { mvp:m.mvpId, gk:m.gkId, hachazo:m.hachazoId, polemica:m.polemicaId }[cat] || null;
}
function toggleAward(pid, cat){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!canEditMatch(m)) return;
  const field = { mvp:'mvpId', gk:'gkId', hachazo:'hachazoId', polemica:'polemicaId' }[cat];
  if(!field) return;
  if(m[field] === pid) m[field] = null;
  else { m[field] = pid; if(cat==='mvp') sfx('mvp'); }
  save(); persistMatch(m); render();
}

/* ---------- Estadísticas ---------- */
function computeStats(){
  const st = {};
  data.players.forEach(p=> st[p.id]={pj:0,goles:0,asist:0,mvp:0,gk:0,v:0,d:0,e:0,escabio:0,hachazos:0,polemicas:0,racha:0,rachaAct:0});
  data.matches.forEach(m=>{
    const a = scoreOf(m,'A'), b = scoreOf(m,'B');
    const resA = a>b ? 'v' : a<b ? 'd' : 'e';
    const resB = b>a ? 'v' : b<a ? 'd' : 'e';
    (m.teamA||[]).forEach(id=>{ if(st[id]){ st[id].pj++; st[id][resA]++; } });
    (m.teamB||[]).forEach(id=>{ if(st[id]){ st[id].pj++; st[id][resB]++; } });
    (m.events||[]).forEach(ev=>{
      if(ev.scorerId && st[ev.scorerId]) st[ev.scorerId].goles++;
      if(ev.assistId && st[ev.assistId]) st[ev.assistId].asist++;
    });
    const _aM = awardId(m,'mvp'), _aG = awardId(m,'gk'), _aH = awardId(m,'hachazo'), _aP = awardId(m,'polemica');
    if(_aM && st[_aM]) st[_aM].mvp++;
    if(_aG && st[_aG]) st[_aG].gk++;
    if(_aH && st[_aH]) st[_aH].hachazos++;
    if(_aP && st[_aP]) st[_aP].polemicas++;
    data.players.forEach(p=>{ st[p.id].escabio += escQty(m, p.id); });
  });
  // racha invicta (actual y mejor historica) por jugador
  data.players.forEach(p=>{
    const ms = data.matches
      .filter(m=>(m.teamA||[]).includes(p.id) || (m.teamB||[]).includes(p.id))
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    let best = 0, cur = 0;
    ms.forEach(m=>{
      const side = (m.teamA||[]).includes(p.id) ? 'A' : 'B';
      const a = scoreOf(m,'A'), b = scoreOf(m,'B');
      const my = side==='A'?a:b, op = side==='A'?b:a;
      if(my >= op){ cur++; if(cur>best) best=cur; } else cur=0;
    });
    st[p.id].rachaAct = cur;
    st[p.id].racha = best;
  });
  return st;
}
function rankCats(){
  return {
    goles:  ['Goles',            s=>s.goles],
    asist:  ['Asistencias',      s=>s.asist],
    ga:     ['Goles + Asist.',   s=>s.goles+s.asist],
    mvp:    ['👑 Figuras',       s=>s.mvp],
    gk:     ['🧤 Mejor arquero', s=>s.gk],
    pj:     ['Partidos jugados', s=>s.pj],
    v:      ['Victorias',        s=>s.v],
    d:      ['Derrotas',         s=>s.d],
    invicto:['Invictos',         s=>s.racha],
    racha:  ['Racha invicta',    s=>s.rachaAct],
    hachazos:['🪓 Hachazos',     s=>s.hachazos],
    polemicas:['📣 Polémica',    s=>s.polemicas]
  };
}
const RANK_HELP = {

  invicto:  'Invictos: máxima cantidad de partidos seguidos sin perder (mejor racha histórica).',
  racha:    'Racha invicta: partidos sin perder que lleva el jugador en la actualidad.',
  hachazos: '🪓 Hachazo: el jugador más pegador del partido.',

  const rest = rows.map((r,i)=>`
    <div class="rank-row clickable" data-action="open-player" data-id="${r.p.id}">

function escabioChartHTML(){
  const short = d => d ? `${d.slice(8,10)}/${d.slice(5,7)}` : 's/f';
  const pts = [...data.matches]
    .filter(m=> m.date)
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''))
    .map(m=>({ date:m.date, v: escTotal(m) }));
  if(pts.length < 2 || !pts.some(p=>p.v>0)) return '';
  const W=320, H=160, padL=26, padR=10, padT=12, padB=24;
  const iw = W-padL-padR, ih = H-padT-padB;
  const maxV = Math.max(1, ...pts.map(p=>p.v));
  const x = i => pts.length>1 ? padL + iw*i/(pts.length-1) : padL + iw/2;
  const y = v => padT + ih - ih*(v/maxV);
  const line = pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(p.v).toFixed(1)}`).join(' ');
  const area = `${line} L${x(pts.length-1).toFixed(1)},${(padT+ih).toFixed(1)} L${x(0).toFixed(1)},${(padT+ih).toFixed(1)} Z`;
  const stepV = Math.max(1, Math.ceil(maxV/5));
  const ticks = [];
  for(let v=0; v<maxV; v+=stepV) ticks.push(v);
  ticks.push(maxV);
  const grid = ticks.map(v=>`<line x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W-padR}" y2="${y(v).toFixed(1)}" stroke="rgba(255,255,255,.14)" stroke-width="1"/>`
    + `<text x="${padL-3}" y="${(y(v)+3).toFixed(1)}" fill="#c9b7ba" font-size="8" text-anchor="end">${v}</text>`).join('');
  const dots = pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3" fill="#f2b705" stroke="#7d2233" stroke-width="1.5"/>`).join('');
  const step = Math.ceil(pts.length/6);
  const labels = pts.map((p,i)=> (i%step===0 || i===pts.length-1) ? `<text x="${x(i).toFixed(1)}" y="${H-7}" fill="#c9b7ba" font-size="9" text-anchor="middle">${short(p.date)}</text>` : '').join('');
  return `<div class="card"><h3>🍾 Escabio por partido</h3>
    <svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Escabio por partido" style="display:block;margin-top:6px">
      ${grid}
      <path d="${area}" fill="rgba(242,183,5,.12)"/>
      <path d="${line}" fill="none" stroke="#f2b705" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dots}${labels}
    </svg>
    <p class="muted" style="text-align:center">Cuánto se tomó en cada partido (total del equipo).</p>
  </div>`;
}

  if(playerEditMode){

    if(!newPositions) newPositions = playerPositions(p).slice();
    return `
      <button class="btn ghost sm" data-action="cancel-edit" style="margin-bottom:14px">← Volver</button>
      <div class="card">
        <h3>Editar jugador</h3>
        <label>Nombre y apellido<input id="e-name" type="text" value="${esc(p.name)}" autocomplete="off"></label>

          <label>Apodo <span class="hint">(opcional)</span><input id="e-nick" type="text" value="${esc(p.nickname||'')}" autocomplete="off"></label>
          <label>Dorsal <span class="hint">(opcional)</span><input id="e-num" type="text" value="${esc(p.number||'')}" inputmode="numeric" autocomplete="off"></label>
        </div>
        <label style="margin-bottom:6px">Posición(es) <span class="hint">(podés elegir varias)</span></label>

          <button class="btn ghost" data-action="cancel-edit">Cancelar</button>
          <button class="btn primary" data-action="save-player">Guardar</button>
        </div>
      </div>`;
  }
  const s = computeStats()[p.id] || {pj:0,goles:0,asist:0,mvp:0,gk:0,v:0,d:0,e:0,escabio:0,hachazos:0,polemicas:0,racha:0,rachaAct:0};
  const played = data.matches
    .filter(m=>(m.teamA||[]).includes(p.id) || (m.teamB||[]).includes(p.id))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const invictos = s.v + s.e;
  const tiles = [['PJ',s.pj,''],['V',s.v,'win'],['E',s.e,''],['D',s.d,'loss'],
                 ['Goles',s.goles,''],['Asist.',s.asist,''],['Hachazos',s.hachazos,'loss'],['Polémica',s.polemicas,'loss'],
                 ['Figura',s.mvp,'gold'],['Arquero',s.gk,'gold'],['Escabio',s.escabio,'gold']]
    .map(([l,v,c])=>`<div class="tile"><span class="tile-num ${c}">${v}</span><span class="tile-lbl">${l}</span></div>`).join('');

  const log = played.length ? played.map(m=>{
    const side = (m.teamA||[]).includes(p.id) ? 'A' : 'B';
    const a = scoreOf(m,'A'), b = scoreOf(m,'B');
    const my = side==='A'?a:b, opp = side==='A'?b:a;
    const res = my>opp?'G':my<opp?'P':'E';
    const rc = res==='G'?'win':res==='P'?'loss':'draw';
    const g = (m.events||[]).filter(ev=> ev.side===side && ev.scorerId===p.id).length;
    const as = (m.events||[]).filter(ev=> ev.side===side && ev.assistId===p.id).length;
    const oppName = side==='A' ? m.teamBName : m.teamAName;
    const mvp = awardId(m,'mvp')===p.id ? '<span class="tag mvp">👑 Figura</span>' : '';
    const gk = awardId(m,'gk')===p.id ? '<span class="tag gk">🧤 Arquero</span>' : '';
    const contrib = `${g?`<span class="pill gold">${g} G</span>`:''}${as?`<span class="pill">${as} A</span>`:''}`;
    return `<div class="log-row">
      <span class="res ${rc}">${res}</span>
      <div class="log-info"><span class="log-date">${fmtDate(m.date)}</span>
        <span class="log-vs">vs ${esc(oppName)}</span>${mvp}${gk}</div>
      <span class="log-score">${my}-${opp}</span>
      <span class="log-contrib">${contrib}</span>
    </div>`;
  }).join('') : '<p class="muted">Todavía no jugó partidos.</p>';

  const poss = playerPositions(p);

  return `
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn ghost sm" data-action="player-back">← Volver</button>
      <button class="btn ghost sm" data-action="edit-player">Editar</button>
    </div>
    <div class="card">
      <div class="profile-top">
        ${playerAvatar(p,72)}
        <div>
          <h2>${esc(p.name)}${invBadge(p)}</h2>
          ${p.nickname?`<p class="muted">"${esc(p.nickname)}"</p>`:''}
          <p class="muted">${p.number?'Dorsal '+esc(p.number):''}${p.number&&poss.length?' · ':''}${poss.length?esc(poss.join(' · ')):''}</p>
        </div>
      </div>
      <div class="tiles">${tiles}</div>
      <div class="streak-box">
        <div class="streak-item"><span class="streak-num">${invictos}</span><span class="streak-lbl">Partidos invictos</span></div>
        <div class="streak-item"><span class="streak-num">${s.rachaAct}</span><span class="streak-lbl">Racha actual</span></div>
        <div class="streak-item"><span class="streak-num">${s.racha}</span><span class="streak-lbl">Mejor racha</span></div>
      </div>
    </div>
    <div class="card"><h3>Partido a partido</h3>${log}</div>
  `;
}

/* ---------- Acciones ---------- */
function createMatch(){
  const date = $('#m-date').value;
  const mode = $('#m-mode').value;
  const rival = mode==='rival' ? ($('#m-rival').value.trim() || 'Rival') : '';
  const m = {
    id: uid(), date, mode,
    teamAName: mode==='rival' ? 'Piel Morena' : 'Equipo A',
    teamBName: mode==='rival' ? rival : 'Equipo B',
    rivalName: rival,
    teamA: [], teamB: [], events: [], mvpId: null, gkId: null
  };
  data.matches.push(m); save(); persistMatch(m); closeModal();
  currentMatchId = m.id; view='partidos'; render();
}
function toggleTeam(pid, side){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!canEditMatch(m)) return;
  const arr = side==='A' ? m.teamA : m.teamB;
  const other = side==='A' ? m.teamB : m.teamA;
  const i = arr.indexOf(pid);
  if(i>=0) arr.splice(i,1);
  else { const j=other.indexOf(pid); if(j>=0) other.splice(j,1); arr.push(pid); }
  save(); persistMatch(m); render();
}
function shuffleTeams(){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!canEditMatch(m)) return;
  const pool = [...new Set([...(m.teamA||[]), ...(m.teamB||[])])];
  if(pool.length < 2){ alert('Marcá al menos 2 jugadores en A o B para poder sortear.'); return; }
  for(let i=pool.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i],pool[j]] = [pool[j],pool[i]]; }
  const a = [], b = [];
  pool.forEach((id,i)=> (i % 2 === 0 ? a : b).push(id));
  const swap = pool.length % 2 === 1 && Math.random() < 0.5;
  m.teamA = swap ? b : a;
  m.teamB = swap ? a : b;
  save(); persistMatch(m); render();
}
function clearTeams(){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!canEditMatch(m)) return;
  m.teamA = []; m.teamB = [];
  save(); persistMatch(m); render();
}
function escAdjust(pid, delta){
  const m = data.matches.find(x=>x.id===escabioMatchId); if(!canEditMatch(m)) return;
  if(!m.escabio || Array.isArray(m.escabio)) m.escabio = migEsc(m);
  let q = (Number(m.escabio[pid]) || 0) + delta;
  if(q < 0) q = 0;
  if(q === 0) delete m.escabio[pid]; else m.escabio[pid] = q;
  save(); persistMatch(m); render();
}
function addComment(){
  const m = data.matches.find(x=>x.id===escabioMatchId); if(!m) return;
  const nameEl = document.getElementById('c-name');
  const textEl = document.getElementById('c-text');
  const name = nameEl ? nameEl.value.trim() : '';
  const text = textEl ? textEl.value.trim() : '';
  if(!text){ alert('Escribí un comentario.'); return; }
  if(name){ commentName = name; localStorage.setItem('pmfc_name', name); }
  if(!m.comments) m.comments = [];
  m.comments.push({ id: uid(), author: name || 'Anónimo', text, ts: Date.now() });
  save(); persistComments(m); render();
}
function delComment(cid){
  const m = data.matches.find(x=>x.id===escabioMatchId); if(!m || !m.comments) return;
  m.comments = m.comments.filter(c=>c.id!==cid);
  save(); persistComments(m); render();
}
function confirmGoal(){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!canEditMatch(m)) return;
  const side = $('#g-side').value;
  const scorerId = $('#g-scorer').value || null;
  const assistEl = $('#g-assist');
  let assistId = assistEl ? (assistEl.value || null) : null;
  if(assistId === scorerId) assistId = null;
  m.events.push({ id: uid(), side, scorerId, assistId });
  sfx('goal'); save(); persistMatch(m); closeModal(); render();
}
function delGoal(id){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!canEditMatch(m)) return;
  m.events = m.events.filter(e=>e.id!==id); save(); persistMatch(m); render();
}
function deleteMatch(id){
  if(!isAdmin && !DEMO){ alert('Solo el administrador ('+ADMIN_EMAIL+') puede eliminar partidos.'); return; }
  if(!confirm('¿Eliminar este partido y sus estadísticas?')) return;
  data.matches = data.matches.filter(m=>m.id!==id);
  currentMatchId=null; save(); removeMatchDoc(id); render();
}
function closeMatch(id){
  const m = data.matches.find(x=>x.id===id); if(!m) return;
  if(!confirm('¿Finalizar el partido? Quedará bloqueado y no se podrán cambiar sus datos.')) return;
  m.closed = true; save(); persistMatch(m); render();
}
function reopenMatch(id){
  if(!isAdmin && !DEMO){ alert('Solo el administrador puede reabrir un partido.'); return; }
  const m = data.matches.find(x=>x.id===id); if(!m) return;
  m.closed = false; save(); persistMatch(m); render();
}
function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function autoCloseOldMatches(){
  if(DEMO) return;
  const today = todayStr();
  let changed = false;
  data.matches.forEach(m=>{
    if(m && !m.closed && m.date && m.date < today){ m.closed = true; persistMatch(m); changed = true; }
  });
  if(changed) save();
}
function addPlayer(){
  const name = $('#p-name').value.trim();
  if(!name){ alert('Poné al menos el nombre.'); return; }
  const p = {
    id: uid(), name,
    nickname: $('#p-nick').value.trim(),
    number: $('#p-num').value.trim(),
    positions: newPositions ? newPositions.slice() : [],
    guest: $('#p-guest').checked,

}

  if(!name){ alert('Escribí el nombre del invitado.'); return; }
  const m = data.matches.find(x=>x.id===currentMatchId); if(!canEditMatch(m)) return;

  if(side === 'B') m.teamB.push(p.id); else m.teamA.push(p.id);

function savePlayer(){
  const p = getPlayer(currentPlayerId); if(!p) return;

  p.name = name;

  p.positions = newPositions ? newPositions.slice() : playerPositions(p);
  p.guest = document.getElementById('e-guest').checked;
  p.face = Object.assign({}, newFace);
  newFace = null; newPositions = null;

  save(); persistPlayer(p); render();
}
function updateFacePreview(){
  const el = document.getElementById('face-preview');
  if(el) el.innerHTML = avatarSVG('new-face',64,newFace);
  document.querySelectorAll('[data-action="face-set"]').forEach(sw=>{
    sw.classList.toggle('on', String(newFace[sw.dataset.key])===sw.dataset.val);

}
function delPlayer(id){
  if(!isAdmin && !DEMO){ alert('Solo el administrador ('+ADMIN_EMAIL+') puede eliminar jugadores.'); return; }
  const p = getPlayer(id); if(!p) return;
  if(!confirm(`¿Eliminar a ${p.name}?`)) return;
  data.players = data.players.filter(x=>x.id!==id);
  data.matches.forEach(m=>{
    m.teamA = m.teamA.filter(x=>x!==id);
    m.teamB = m.teamB.filter(x=>x!==id);
    m.events = (m.events||[]).filter(e=> e.scorerId!==id && e.assistId!==id);
    if(m.mvpId===id) m.mvpId=null;
    if(m.gkId===id) m.gkId=null;
  });
  save(); removePlayerDoc(id); data.matches.forEach(persistMatch); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'piel-morena-fc.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.players) || !Array.isArray(d.matches)) throw 0;
        data = d; save(); currentMatchId=null; render();
        alert('Datos importados correctamente.');
      }catch(e){ alert('El archivo no es válido.'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
async function resetData(){
  if(DEMO){
    if(!confirm('¿Restaurar los datos de ejemplo de la demo? Se descartan tus cambios locales.')) return;
    data = demoSeed(); currentMatchId=null; escabioMatchId=null; save(); render();
    return;
  }
  if(!confirm('Esto borra TODOS los jugadores y partidos (de este dispositivo y de la nube). ¿Seguro?')) return;
  if(!confirm('Última confirmación: se pierde todo. ¿Continuar?')) return;
  data = { players:[], matches:[] }; currentMatchId=null; escabioMatchId=null; save();
  if(fsReady()){
    try{
      const ps = await db.collection('players').get();
      const ms = await db.collection('matches').get();
      const batch = db.batch();
      ps.forEach(d=> batch.delete(d.ref));
      ms.forEach(d=> batch.delete(d.ref));
      await batch.commit();
    }catch(e){ cloudFail(e); }
  }
  render();
}
/* ---------- Himno 8-bit (composicion original) ---------- */
let himnoOn = false, himnoTimer = null, himnoOsc = [], noiseBuf = null;
const HNOTE = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nfreq(n){ const m = /^([A-G]#?)(\d)$/.exec(n); return m ? 440*Math.pow(2, ((HNOTE[m[1]]-9)/12) + (+m[2]-4)) : 440; }
function hnote(n, t, dur, type, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square'; o.frequency.value = nfreq(n);
  o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
  himnoOsc.push(o);
}
function hnoise(t, dur, vol, hp){
  const c = ac(); if(!c) return;
  if(!noiseBuf){ const len = Math.floor(c.sampleRate*0.3); noiseBuf = c.createBuffer(1,len,c.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const g = c.createGain();
  if(hp){ const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; s.connect(f); f.connect(g); } else s.connect(g);
  g.connect(c.destination);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.start(t); s.stop(t + dur + 0.02);
  himnoOsc.push(s);
}
function hkick(t, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2);
  himnoOsc.push(o);
}
function htom(t, f0, f1, vol, dur){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  himnoOsc.push(o);
}
const HIMNO_BEAT = 0.55;
// Himno "latino" (cumbia 8-bit, composicion original) - Am F C G
const HIMNO_MEL = [
  ['A4',0,.5],['C5',.5,.5],['E5',1,.5],['A5',1.5,.5],['G5',2,1],['E5',3,1],
  ['F5',4,.5],['A5',4.5,.5],['G5',5,.5],['F5',5.5,.5],['E5',6,2],
  ['E5',8,.5],['G5',8.5,.5],['C6',9,.5],['B5',9.5,.5],['A5',10,1],['G5',11,1],
  ['D5',12,.5],['F5',12.5,.5],['E5',13,.5],['D5',13.5,.5],['E5',14,1],['A5',15,1]
];
const HIMNO_BARS = [['A2','E3'],['F2','C3'],['C3','G3'],['G2','D3']];
function himnoOnce(t0){
  himnoOsc = [];
  const beat = HIMNO_BEAT;
  HIMNO_MEL.forEach(([n,s,l])=> hnote(n, t0+s*beat, l*beat*0.9, 'square', 0.11));
  // tumbao: bajo en corcheas alternando raiz y quinta
  HIMNO_BARS.forEach(([root,fifth], bi)=>{
    for(let e=0; e<8; e++){
      hnote(e%2===0 ? root : fifth, t0 + bi*4*beat + e*0.5*beat, 0.5*beat*0.85, 'triangle', 0.16);
    }
  });
  // percusion tropical
  for(let b=0;b<16;b+=2) hkick(t0 + b*beat, 0.42);                          // bombo
  for(let b=1;b<16;b+=2) hnoise(t0 + b*beat, 0.09, 0.13, 1600);             // palma/rim
  for(let i=0;i<64;i++) hnoise(t0 + i*0.25*beat, 0.02, i%4===2 ? 0.055 : 0.03, 5500); // guira 16avos
  for(let b=0;b<16;b++) htom(t0 + (b+0.5)*beat, 220, 150, 0.13, 0.10);      // tom en contratiempo
}
function toggleHimno(){
  if(himnoOn){ stopHimno(); return; }
  const c = ac(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  himnoOn = true; updateHimnoBtn();
  const loopDur = 16*HIMNO_BEAT;
  let start = c.currentTime + 0.08;
  const step = ()=>{
    if(!himnoOn) return;
    himnoOnce(start);
    start += loopDur;
    himnoTimer = setTimeout(step, loopDur*1000 - 120);
  };
  step();
}
function stopHimno(){
  himnoOn = false;
  if(himnoTimer){ clearTimeout(himnoTimer); himnoTimer = null; }
  himnoOsc.forEach(o=>{ try{ o.stop(); }catch(e){} try{ o.disconnect(); }catch(e){} });
  himnoOsc = [];
  updateHimnoBtn();
}
function updateHimnoBtn(){
  const b = document.getElementById('music-btn');
  if(!b) return;
  b.textContent = himnoOn ? 'Parar' : 'Himno';
  b.classList.toggle('playing', himnoOn);
}

/* ---------- Efectos 8-bit (Web Audio, originales) ---------- */
let sfxOn = localStorage.getItem('pmfc_sfx') !== 'off';
let actx = null;
function ac(){
  if(actx) return actx;
  try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  return actx;
}
function tone(freq, start, dur, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'square'; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(name){
  if(!sfxOn) return;
  const c = ac(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  const S = {
    goal:    [[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.27,.22]],
    mvp:     [[784,0,.08],[988,.08,.08],[1319,.16,.26]],
    add:     [[659,0,.07],[988,.07,.12]],
    del:     [[440,0,.09],[330,.09,.16]],
    escabio: [[196,0,.12],[185,.13,.12],[175,.26,.20]],
    click:   [[880,0,.04]]
  }[name];
  if(!S) return;
  S.forEach(([f,t,d])=> tone(f, t, d, name==='click' ? 0.07 : 0.16));
}
const SFX_BY_ACTION = {
  'add-player':'add','add-guest':'add','create-match':'add','add-goal':'add','add-comment':'add',
  'shuffle-teams':'add','face-random':'add','save-player':'add',
  'del-player':'del','del-goal':'del','del-comment':'del','delete-match':'del','clear-teams':'del'
};
function uiSound(action){
  if(!sfxOn) return;
  if(action === 'toggle-sfx' || action === 'confirm-goal') return;
  sfx(SFX_BY_ACTION[action] || 'click');
}
function updateSfxBtn(){
  const b = document.getElementById('sfx-btn');
  if(b) b.textContent = sfxOn ? 'Sonido' : 'Mudo';
}
function toggleSfx(){
  sfxOn = !sfxOn;
  localStorage.setItem('pmfc_sfx', sfxOn ? 'on' : 'off');
  updateSfxBtn();
  if(sfxOn) sfx('add');
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action, id = t.dataset.id;
  uiSound(a);
  switch(a){
    case 'tab': view = t.dataset.view; currentMatchId=null; render(); break;
    case 'open-match': currentMatchId=id; view='partidos'; render(); break;
    case 'back': currentMatchId=null; render(); break;
    case 'new-match': openNewMatch(); break;
    case 'create-match': createMatch(); break;
    case 'add-player': addPlayer(); break;
    case 'add-guest': addGuest(t.dataset.side); break;
    case 'del-player': delPlayer(id); break;
    case 'face-set': {
      newFace[t.dataset.key] = parseInt(t.dataset.val, 10);
      updateFacePreview();
      break;
    }
    case 'face-random': newFace = randomFace(); updateFacePreview(); break;
    case 'pos-toggle': {
      if(!newPositions) newPositions = [];
      const v = t.dataset.val, i = newPositions.indexOf(v);
      if(i >= 0) newPositions.splice(i, 1); else newPositions.push(v);
      updatePosPills();
      break;
    }
    case 'open-player': playerBackView = view; currentPlayerId = id; playerEditMode = false; view='jugador'; render(); break;
    case 'player-back': playerEditMode = false; newFace = null; newPositions = null; view = playerBackView; currentPlayerId = null; render(); break;
    case 'edit-player': { const p = getPlayer(currentPlayerId); if(!p) break; newFace = normFace(p.face); newPositions = playerPositions(p).slice(); playerEditMode = true; render(); break; }
    case 'cancel-edit': playerEditMode = false; newFace = null; newPositions = null; render(); break;
    case 'save-player': savePlayer(); break;
    case 'toggle-team': toggleTeam(id, t.dataset.side); break;
    case 'aw': toggleAward(id, t.dataset.cat); break;
    case 'shuffle-teams': shuffleTeams(); break;
    case 'clear-teams': clearTeams(); break;
    case 'esc-inc': escAdjust(id, 1); break;
    case 'esc-dec': escAdjust(id, -1); break;
    case 'add-comment': addComment(); break;
    case 'del-comment': delComment(id); break;
    case 'rank-cat': rankCat = t.dataset.cat; render(); break;
    case 'add-goal': openAddGoal(t.dataset.side); break;
    case 'confirm-goal': confirmGoal(); break;
    case 'del-goal': delGoal(id); break;
    case 'delete-match': deleteMatch(id); break;
    case 'close-match': closeMatch(id); break;
    case 'reopen-match': reopenMatch(id); break;
    case 'admin-login': adminLogin(); break;
    case 'admin-logout': adminLogout(); break;
    case 'modal-close': closeModal(); break;
    case 'overlay': if(e.target===t) closeModal(); break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'reset': resetData(); break;
    case 'cloud-save-config': saveFbConfig(); break;
    case 'cloud-help': openCloudHelp(); break;
    case 'toggle-sfx': toggleSfx(); break;
    case 'toggle-music': toggleHimno(); break;
    case 'bk-now': createBackup('manual'); break;
    case 'bk-download': downloadBackup(id); break;
    case 'bk-restore': restoreBackup(id); break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='m-mode'){
    const w = $('#m-rival-wrap');
