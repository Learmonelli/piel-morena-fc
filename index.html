<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0c2814">
<title>Piel Morena FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c2814; --bg2:#3f111e; --card:#3f111e; --card2:#52182a; --line:#7a2a3c;
    --txt:#eafff0; --muted:#9fd3ac;
    --gold:#ffd23f; --gold-d:#d9a400;
    --burgundy:#8a2334; --purple:#8a4fbf; --green:#5fd35f; --red:#ff5a5f;
    --skin:#b5703c; --cream:#f3ead6;
    --font-body:'VT323',ui-monospace,Consolas,monospace;
    --font-pixel:'Press Start 2P',ui-monospace,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(1200px 600px at 50% -200px,#1c5a33 0%,var(--bg) 60%) fixed;
    color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
    min-height:100vh;
  }
  .app{max-width:720px;margin:0 auto;padding:0 16px;position:relative;z-index:1}

  /* Canchita 8-bit de fondo */
  #pitch-bg{position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.38}
  #pitch-bg svg{width:100%;height:100%;display:block}
  #pitch-bg::after{content:"";position:absolute;inset:0;
    background:radial-gradient(120% 80% at 50% 0%,transparent 30%,rgba(21,10,14,.55) 100%)}

  /* Header */
  .app-header{padding:22px 0 14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;column-gap:10px;row-gap:8px}
  .brand{flex:1 1 170px;min-width:0}
  .music-btn{background:#330f1c;border:1px solid var(--line);color:var(--gold);
    border-radius:12px;padding:10px 14px;cursor:pointer;font-family:inherit;
    font-weight:700;font-size:13px;transition:.15s;white-space:nowrap}
  .music-btn.playing{background:linear-gradient(145deg,#ffd23f,var(--gold-d));color:#2a1706;border-color:var(--gold)}
  .header-btns{display:flex;gap:6px;flex:0 0 auto;margin-left:auto}
  .header-btns .music-btn{padding:10px 10px;font-size:12px}
  @media (max-width:430px){
    .brand h1{font-size:10px}
    .brand p{font-size:13px}
    .header-btns .music-btn{padding:9px 8px;font-size:11px}
  }
  .brand{display:flex;align-items:center;gap:12px}
  .crest{width:52px;height:58px;flex:0 0 auto;
    filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}
  .brand h1{margin:0;font-size:19px;letter-spacing:.3px}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--muted)}

  /* Tabs */
  .tabs{display:flex;gap:6px;background:#330f1c;border:1px solid var(--line);
    border-radius:14px;padding:5px;margin-bottom:18px}
  .tabs button{
    flex:1;border:0;background:transparent;color:var(--muted);font-weight:600;
    font-size:13px;padding:10px 6px;border-radius:10px;cursor:pointer;transition:.15s;
  }
  .tabs button.active{background:var(--card2);color:var(--txt);box-shadow:0 2px 8px rgba(0,0,0,.25)}

  /* Sections */
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
  .section-head h2{margin:0;font-size:17px}
  h3{margin:0 0 14px;font-size:16px}

  /* Buttons */
  .btn{border:0;border-radius:11px;padding:11px 16px;font-size:14px;font-weight:700;
    cursor:pointer;transition:.15s;font-family:inherit}
  .btn.primary{background:linear-gradient(145deg,#ffd23f,var(--gold-d));color:#2a1706;
    box-shadow:0 4px 14px rgba(242,183,5,.25)}
  .btn.primary:active{transform:scale(.97)}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--red);border:1px solid #5a2028}
  .btn.sm{padding:8px 12px;font-size:13px}
  .btn.block{width:100%}
  .icon-btn{background:transparent;border:1px solid var(--line);color:var(--muted);
    width:30px;height:30px;border-radius:9px;cursor:pointer;font-size:15px;line-height:1}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:16px;margin-bottom:12px}
  .match-card{cursor:pointer;transition:.15s}
  .match-card:active{transform:scale(.99)}
  .match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .date{font-size:12px;color:var(--muted);font-weight:600}
  .tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .tag.mvp{background:rgba(106,44,145,.28);color:#d9b6ef}
  .tag.hachazo{background:rgba(229,72,77,.2);color:#ff9a9d}
  .tags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .match-title{font-size:15px;font-weight:700;margin-bottom:10px}
  .score{display:flex;align-items:center;justify-content:center;gap:14px;
    font-size:30px;font-weight:800}
  .score span{color:var(--muted);font-size:20px}

  /* Scoreboard in detail */
  .board{display:flex;align-items:center;justify-content:center;gap:18px;margin:4px 0 8px}
  .board .team{flex:1;text-align:center}
  .board .team .nm{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:4px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .board .team .go{font-size:42px;font-weight:800;line-height:1}
  .board .vs{color:var(--muted);font-weight:700}

  /* Forms */
  label{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:12px}
  input,select{width:100%;margin-top:6px;background:#320d18;border:1px solid var(--line);
    color:var(--txt);border-radius:11px;padding:12px;font-size:15px;font-family:inherit}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hint{font-weight:400;font-size:11px}

  /* Assign rows */
  .assign-row{display:flex;align-items:center;justify-content:space-between;
    padding:9px 0;border-bottom:1px solid rgba(74,33,48,.55)}
  .assign-row:last-child{border-bottom:0}
  .assign-row .pname{font-size:14px;display:flex;align-items:center;gap:6px}
  .num{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 5px;
    background:var(--card2);border-radius:7px;font-size:11px;color:var(--muted)}
  .pixel-avatar{border-radius:5px;border:1px solid var(--line);flex:0 0 auto;display:block}

  /* Editor de cara */
  .face-editor{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
  .face-preview{display:flex;justify-content:center}
  .face-preview svg{width:64px;height:64px}
  .face-controls{display:flex;flex-direction:column;gap:8px}
  .face-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .face-lbl{font-size:12px;color:var(--muted);width:62px;flex:0 0 auto;font-weight:700}
  .swatch{width:24px;height:24px;border-radius:6px;border:2px solid rgba(0,0,0,.45);cursor:pointer;padding:0}
  .swatch.on{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
  .face-pill{background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:8px;
    padding:5px 10px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .face-pill.on{background:var(--gold);border-color:var(--gold);color:#2a1706}

  /* Nube */
  .cloud-line{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:0 0 auto}
  .dot-ok{background:#5fd35f}
  .dot-sync{background:var(--gold)}
  .dot-local{background:var(--gold)}
  .dot-off{background:#9fd3ac}
  .dot-err{background:var(--red)}
  .dot-idle{background:var(--muted)}
  textarea{width:100%;margin-top:6px;background:#320d18;border:2px solid #240a12;color:var(--txt);
    border-radius:8px;padding:12px;font-size:15px;font-family:var(--font-body);resize:vertical}
  pre.rules{background:#0a1a10;border:1px solid var(--line);border-radius:8px;padding:10px;
    font-size:11px;line-height:1.5;overflow-x:auto;color:#bfe08a;white-space:pre}
  .side-btns{display:flex;gap:6px}
  .sidebtn{background:transparent;border:1px solid var(--line);color:var(--muted);
    border-radius:9px;padding:7px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .sidebtn.on{background:var(--gold);border-color:var(--gold);color:#2a1706}

  /* Goals */
  .goal-row{display:flex;align-items:center;gap:10px;padding:9px 0;
    border-bottom:1px solid rgba(74,33,48,.55)}
  .goal-row:last-child{border-bottom:0}
  .goal-side{font-size:11px;font-weight:700;color:var(--gold);background:rgba(242,183,5,.12);
    padding:3px 8px;border-radius:7px;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .goal-main{flex:1;font-size:14px}
  .goal-main .as{color:var(--muted);font-size:12px}

  /* Table */
  .table{width:100%;border-collapse:collapse;font-size:13px}
  .table th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;
    letter-spacing:.5px;padding:8px 6px;border-bottom:1px solid var(--line)}
  .table td{padding:10px 6px;border-bottom:1px solid rgba(74,33,48,.45)}
  .table th.c,.table td.c{text-align:center;width:44px}
  .table tr:first-child td .rk{color:var(--gold)}
  .rk{font-weight:800;color:var(--muted);font-size:12px}
  .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .table-wrap .table{min-width:780px}

  /* Ranking */
  .cat-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
  .cat-pill{background:transparent;border:2px solid var(--line);color:var(--muted);border-radius:20px;
    padding:5px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
  .cat-pill.on{background:var(--gold);border-color:var(--gold);color:#2a1706}
  .podium{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;align-items:end}
  .podium-item{background:#320d18;border:2px solid var(--line);border-radius:12px;padding:10px 6px;
    text-align:center;position:relative}
  .podium-item.p1{border-color:var(--gold);box-shadow:0 0 0 2px rgba(242,183,5,.25)}
  .podium-item.p2{border-color:#cfd8dc}
  .podium-item.p3{border-color:#c98a4b}
  .podium-item .medal{position:absolute;top:6px;left:7px;font-weight:800;font-size:12px;color:var(--muted)}
  .podium-item .pixel-avatar{margin:6px auto 0;width:48px;height:48px}
  .podium-name{display:block;font-size:12px;font-weight:700;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .podium-val{display:block;font-size:22px;font-weight:800;color:var(--gold);line-height:1.1}
  .podium-cat{display:block;font-size:9px;text-transform:uppercase;color:var(--muted);letter-spacing:.4px}
  .rank-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(74,33,48,.55)}
  .rank-row:last-child{border-bottom:0}
  .rank-pos{width:24px;text-align:center;font-weight:800;color:var(--muted);font-size:13px;flex:0 0 auto}
  .rank-name{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank-sub{color:var(--muted);font-size:11px}
  .rank-val{font-weight:800;font-size:18px;color:var(--gold)}

  /* Post-partido: escabio + comentarios */
  .esc-ctrl{display:flex;align-items:center;gap:8px}
  .esc-val{min-width:24px;text-align:center;font-weight:800;font-size:17px;color:var(--gold)}
  .comment{border-bottom:1px solid rgba(74,33,48,.55);padding:8px 0}
  .comment:last-child{border-bottom:0}
  .comment-head{display:flex;align-items:center;gap:8px}
  .comment-head b{font-size:14px}
  .comment-time{font-size:11px;color:var(--muted);flex:1}
  .comment-head .icon-btn{margin-left:auto}
  .comment-text{margin:4px 0 0;font-size:15px;word-break:break-word;white-space:pre-wrap}

  /* Ayuda */
  details.help{border-bottom:1px solid rgba(74,33,48,.55);padding:9px 0}
  details.help:last-child{border-bottom:0}
  details.help summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}
  details.help summary::-webkit-details-marker{display:none}
  details.help summary::before{content:"\25B8  ";color:var(--gold)}
  details.help[open] summary::before{content:"\25BE  "}
  details.help p{margin:6px 0 0;font-size:14px;line-height:1.5}
  .clickable{cursor:pointer}
  .win{color:#bfe08a}
  .loss{color:#ff9a9d}
  .gold{color:var(--gold)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;
    background:var(--card2);color:var(--muted);white-space:nowrap}
  .pill.win{background:rgba(139,195,74,.18);color:#bfe08a}
  .pill.loss{background:rgba(255,90,95,.16);color:#ff9a9d}
  .pill.gold{background:rgba(242,183,5,.16);color:var(--gold)}

  /* Resumen ganador/perdedor */
  .summary{display:flex;gap:12px}
  .summary .sum-item{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
  .summary .sum-item+.sum-item{border-left:1px solid var(--line);padding-left:12px}
  .sum-item .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700}
  .sum-item .val{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
  .sum-item .val b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* Ficha de jugador */
  .profile-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .profile-top h2{margin:0;font-size:20px}
  .profile-top p{margin:3px 0 0;font-size:12px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .tile{background:#320d18;border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
  .tile-num{display:block;font-size:20px;font-weight:800;line-height:1.15}
  .tile-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700}
  .streak-box{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;
    background:linear-gradient(145deg,rgba(242,183,5,.14),rgba(242,183,5,.04));
    border:2px solid var(--gold);border-radius:12px;padding:12px 6px;text-align:center}
  .streak-item{display:flex;flex-direction:column;gap:2px;min-width:0}
  .streak-item + .streak-item{border-left:1px solid rgba(242,183,5,.3)}
  .streak-num{font-size:26px;font-weight:800;color:var(--gold);line-height:1.1}
  .streak-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);font-weight:700}
  .log-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(74,33,48,.55)}
  .log-row:last-child{border-bottom:0}
  .res{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;font-size:12px;font-weight:800}
  .res.win{background:rgba(139,195,74,.2);color:#bfe08a}
  .res.loss{background:rgba(255,90,95,.18);color:#ff9a9d}
  .res.draw{background:var(--card2);color:var(--muted)}
  .log-info{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
  .log-date{font-size:11px;color:var(--muted);font-weight:600}
  .log-vs{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .log-info .tag.mvp{align-self:flex-start;margin-top:2px}
  .log-score{font-weight:800;font-size:15px}
  .log-contrib{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:84px}

  .muted{color:var(--muted);font-size:13px}
  .empty{text-align:center;color:var(--muted);padding:36px 16px;font-size:14px}
  .empty .big{display:block;font-size:34px;margin-bottom:10px;opacity:.6}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
    display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:16px}
  .modal{background:var(--bg2,#3f111e);border:1px solid var(--line);border-radius:20px;
    padding:20px;width:100%;max-width:440px;animation:up .18s ease}
  @keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
  .modal-actions{display:flex;gap:10px;margin-top:6px}
  .modal-actions .btn{flex:1}
  @media (min-width:520px){.overlay{align-items:center}}

  /* ===== Tema Cancha arcade ===== */
  body{font-family:var(--font-body);font-size:19px;letter-spacing:.3px}
  .brand h1{font-family:var(--font-pixel);font-size:12px;line-height:1.75;letter-spacing:0}
  .brand p{font-size:16px;font-family:var(--font-body)}
  h2,h3{font-family:var(--font-pixel);font-size:10px;line-height:1.7;letter-spacing:.5px}
  .section-head h2{font-size:10px}
  .tabs{border:3px solid #240a12;border-radius:12px;padding:6px}
  .tabs button{font-family:var(--font-pixel);font-size:8px;line-height:1.6;padding:12px 4px;letter-spacing:0}
  .card{border:3px solid #240a12;border-radius:12px;box-shadow:6px 6px 0 rgba(0,0,0,.42)}
  .btn{border-radius:8px;font-family:var(--font-body);font-size:19px;letter-spacing:.5px;
    text-transform:uppercase}
  .btn.primary{box-shadow:3px 3px 0 rgba(0,0,0,.5)}
  .btn.ghost{border:2px solid var(--line);box-shadow:3px 3px 0 rgba(0,0,0,.3)}
  .btn.danger{border:2px solid #5a2028;box-shadow:3px 3px 0 rgba(0,0,0,.3)}
  .sidebtn{border:2px solid var(--line);font-family:var(--font-body);font-size:15px}
  .sidebtn.on{box-shadow:2px 2px 0 rgba(0,0,0,.5)}
  input,select{border:2px solid #240a12;border-radius:8px;font-family:var(--font-body);font-size:19px}
  .muted{font-size:15px}
  .date{font-size:14px}
  .match-title{font-size:18px}
  .score{font-size:38px}
  .board .team .go{font-size:48px}
  .board .team .nm{font-size:15px}
  .assign-row .pname{font-size:17px}
  .goal-main{font-size:17px}
  .goal-main .as{font-size:13px}
  .table{font-size:16px}
  .table th{font-size:11px}
  .tile-num{font-size:24px}
  .log-score{font-size:18px}
  .log-vs{font-size:16px}
  .log-date{font-size:13px}
  .music-btn{font-family:var(--font-body);font-size:17px;text-transform:uppercase}
  .num{font-size:13px;height:24px}
  .empty{font-size:17px}
</style>
</head>
<body>
<div id="pitch-bg" aria-hidden="true">
  <svg viewBox="0 0 240 360" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
    <rect width="240" height="360" fill="#17622f"/>
    <g fill="#1d7a3c">
      <rect x="0" y="0" width="30" height="360"/>
      <rect x="60" y="0" width="30" height="360"/>
      <rect x="120" y="0" width="30" height="360"/>
      <rect x="180" y="0" width="30" height="360"/>
    </g>
    <g fill="#f3ead6" stroke="#f3ead6" stroke-width="4" shape-rendering="crispEdges">
      <rect x="8" y="8" width="224" height="4" stroke="none"/>
      <rect x="8" y="348" width="224" height="4" stroke="none"/>
      <rect x="8" y="8" width="4" height="344" stroke="none"/>
      <rect x="228" y="8" width="4" height="344" stroke="none"/>
      <rect x="8" y="178" width="224" height="4" stroke="none"/>
      <circle cx="120" cy="180" r="42" fill="none"/>
      <rect x="116" y="176" width="8" height="8" stroke="none"/>
      <rect x="60" y="8" width="120" height="58" fill="none"/>
      <rect x="90" y="8" width="60" height="24" fill="none"/>
      <rect x="60" y="294" width="120" height="58" fill="none"/>
      <rect x="90" y="328" width="60" height="24" fill="none"/>
      <path d="M8 8 h44 M8 8 v24" fill="none"/>
      <path d="M232 8 h-44 M232 8 v24" fill="none"/>
      <path d="M8 352 h44 M8 352 v-24" fill="none"/>
      <path d="M232 352 h-44 M232 352 v-24" fill="none"/>
    </g>
  </svg>
</div>
<div class="app">
  <header class="app-header">
    <div class="brand">

const KEY = 'pielmorenafc_v1';
let data = load();
let view = 'partidos';
let currentMatchId = null;
let currentPlayerId = null;
let playerBackView = 'jugadores';
let newFace = null;
let rankCat = 'racha';
let escabioMatchId = null;
let commentName = localStorage.getItem('pmfc_name') || '';
let playerEditMode = false;

function load(){
  try{
    const r = JSON.parse(localStorage.getItem(KEY));
    if(r && Array.isArray(r.players) && Array.isArray(r.matches)) return r;
  }catch(e){}
  return { players:[], matches:[] };
}
function save(){ localStorage.setItem(KEY, JSON.stringify(data)); }

/* ---------- Nube (Firebase / Firestore) ---------- */
const FBCFG_KEY = 'pielmorenafc_fbconfig';
const DEFAULT_FB_CONFIG = {
  apiKey: "AIzaSyCwWiw-_4CSzSv5jXeHYd9eHwzOoUrssOQ",
  authDomain: "piel-morena-fc.firebaseapp.com",
  projectId: "piel-morena-fc",
  storageBucket: "piel-morena-fc.firebasestorage.app",
  messagingSenderId: "198605126708",
  appId: "1:198605126708:web:d3c0f2de78e18041e01e61"
};
let fbConfig = loadFbConfig();
let db = null;
let cloudStarted = false;
let cloudStarting = false;
let cloudState = { status:'unset', message:'' };

function loadFbConfig(){
  try{ const c = JSON.parse(localStorage.getItem(FBCFG_KEY)); if(c && c.projectId) return c; }catch(e){}
  return DEFAULT_FB_CONFIG;
}
function cloudConfigured(){ return !!fbConfig; }
function fsReady(){ return !!db; }

function parseFbConfig(text){
  let s = String(text||'').trim();
  s = s.replace(/^\s*(const|let|var)\s+\w+\s*=\s*/, '').replace(/;\s*$/, '');
  const obj = new Function('return (' + s + ');')();
  if(!obj || !obj.projectId) throw new Error('falta projectId');
  return obj;
}
function saveFbConfig(){
  const el = document.getElementById('fb-config');
  try{
    fbConfig = parseFbConfig(el ? el.value : '');
    localStorage.setItem(FBCFG_KEY, JSON.stringify(fbConfig));
    cloudStarted = false; db = null;
    initCloud(); render();
  }catch(e){ alert('No pude leer la config: ' + e.message); }
}
function changeFbConfig(){
  if(!confirm('¿Cambiar la configuración de Firebase?')) return;
  localStorage.removeItem(FBCFG_KEY);
  fbConfig = DEFAULT_FB_CONFIG; db = null; cloudStarted = false;
  cloudState = { status:'unset', message:'' };
  initCloud(); render();
}

function loadScript(src){
  return new Promise((res, rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = ()=>rej(new Error('No cargó ' + src));
    document.head.appendChild(s);
  });
}
async function ensureFirebase(){
  if(typeof firebase !== 'undefined') return true;
  if(!window.__fbLoading){
    window.__fbLoading = (async()=>{
      await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js');
      await loadScript('https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js');
    })();
  }
  try{ await window.__fbLoading; return typeof firebase !== 'undefined'; }
  catch(e){ window.__fbLoading = null; return false; }
}
async function initCloud(){
  if(!cloudConfigured()){ cloudState = { status:'unset', message:'' }; renderCloudStatus(); return; }
  if(cloudStarted || cloudStarting) return;
  cloudStarting = true;
  cloudState = { status:'syncing', message:'Conectando...' }; renderCloudStatus();
  const ok = await ensureFirebase();
  if(!ok){
    cloudStarting = false;
    cloudState = { status:'error', message:'No se pudo cargar Firebase (revisá la conexión).' };
    renderCloudStatus(); return;
  }
  try{
    firebase.initializeApp(fbConfig);
    db = firebase.firestore();
    cloudStarted = true;

    db.collection('players').onSnapshot(snap=>{
      data.players = snap.docs.map(d=>d.data());
      afterSnapshot();
    }, err=>cloudFail(err));

    db.collection('matches').onSnapshot(snap=>{
      data.matches = snap.docs.map(d=>d.data());
      afterSnapshot();
    }, err=>cloudFail(err));
  }catch(e){
    cloudState = { status:'error', message:'Error al iniciar Firebase: ' + e.message };
    renderCloudStatus();
  }
  cloudStarting = false;
}
function afterSnapshot(){
  localStorage.setItem(KEY, JSON.stringify(data));
  if(cloudState.status !== 'error') cloudState = { status:'ok', message:'Sincronizado en tiempo real.' };
  render();
}

function persistPlayer(p){ if(fsReady()) db.collection('players').doc(p.id).set(p).catch(e=>cloudFail(e)); }
function removePlayerDoc(id){ if(fsReady()) db.collection('players').doc(id).delete().catch(e=>cloudFail(e)); }
function persistMatch(m){ if(fsReady()) db.collection('matches').doc(m.id).set(m).catch(e=>cloudFail(e)); }
function removeMatchDoc(id){ if(fsReady()) db.collection('matches').doc(id).delete().catch(e=>cloudFail(e)); }
function cloudFail(e){ cloudState = { status:'error', message:'Error: ' + (e && e.message ? e.message : e) }; renderCloudStatus(); }

function cloudStatusHTML(){
  const map = {
    ok:['dot-ok','Conectado'], syncing:['dot-sync','Sincronizando'],
    error:['dot-err','Error'], local:['dot-local','Solo en este dispositivo'],
    unset:['dot-idle','Sin configurar']
  };
  const [cls,lbl] = map[cloudState.status] || map.unset;
  return `<div class="cloud-line"><span class="dot ${cls}"></span><b>${lbl}</b></div>
    ${cloudState.message ? `<p class="muted">${esc(cloudState.message)}</p>` : ''}`;
}
function renderCloudStatus(){
  const el = document.getElementById('cloud-status');
  if(el) el.innerHTML = cloudStatusHTML();
}
function openCloudHelp(){
  openModal(`
    <h3>Cómo conectar la nube (Firebase)</h3>
    <p class="muted">Se hace una sola vez. Después todos ven y cargan en tiempo real.</p>
    <ol class="muted" style="padding-left:18px;line-height:1.75">
      <li>Entrá a <b>console.firebase.google.com</b> con tu cuenta de Google y creá un proyecto.</li>
      <li>Menú <b>Compilación → Firestore Database</b> → Crear base de datos → <b>modo producción</b>.</li>
      <li>Pestaña <b>Reglas</b>: pegá las reglas de abajo y tocá Publicar.</li>
      <li>Engranaje ⚙ → <b>Configuración del proyecto</b> → "Tus apps" → app <b>Web (&lt;/&gt;)</b> → copiá el objeto <b>firebaseConfig</b>.</li>
      <li>Pegalo en el campo de abajo y guardá. Listo.</li>
    </ol>
    <p class="muted">Reglas (cualquiera con el link puede leer y cargar):</p>
    <pre class="rules">rules_version = '2';
service cloud.firestore {
  match /databases/{db}/documents {
    match /players/{id} { allow read, write: if true; }
    match /matches/{id} { allow read, write: if true; }
  }
}</pre>
    <div class="modal-actions"><button class="btn primary" data-action="modal-close">Entendido</button></div>
  `);
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function $(s){ return document.querySelector(s); }
function fmtDate(d){ if(!d) return 'Sin fecha'; const [y,m,day]=d.split('-'); return `${day}/${m}/${y}`; }
function getPlayer(id){ return data.players.find(p=>p.id===id); }
function pname(id){ const p=getPlayer(id); return p ? (p.nickname || p.name) : '—'; }
function scoreOf(m,side){ return (m.events||[]).filter(e=>e.side===side).length; }
function qtyOf(map, id){
  if(!map) return 0;
  if(Array.isArray(map)) return map.includes(id) ? 1 : 0;
  return Number(map[id]) || 0;
}
function totalOf(map){
  if(!map) return 0;
  if(Array.isArray(map)) return map.length;
  return Object.values(map).reduce((sum,v)=> sum + (Number(v) || 0), 0);
}
function migMap(map){
  const o = {};
  if(Array.isArray(map)) map.forEach(id=>{ o[id] = 1; });
  else if(map && typeof map === 'object') Object.assign(o, map);
  return o;
}
function escQty(m, id){ return qtyOf(m.escabio, id); }
function migEsc(m){ return migMap(m.escabio); }
function escTotal(m){ return totalOf(m.escabio); }
function patQty(m, id){ return qtyOf(m.patadas, id); }
function patTotal(m){ return totalOf(m.patadas); }

/* ---------- Avatar pixel art (16-bit) ---------- */
function hashStr(s){
  let h = 2166136261 >>> 0;
  for(const c of String(s)){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r = Math.min(255, Math.max(0, Math.round(((n>>16)&255)*f)));
  const g = Math.min(255, Math.max(0, Math.round(((n>>8)&255)*f)));
  const b = Math.min(255, Math.max(0, Math.round((n&255)*f)));
  return '#' + ((1<<24) + (r<<16) + (g<<8) + b).toString(16).slice(1);
}
const AV_SKIN  = ['#f1c9a5','#e8b98f','#dda96f','#c68642','#a9713f','#8d5524','#7a4a22'];
const AV_HAIR  = ['#161616','#2e2119','#4a2f1b','#8a5a2b','#d9a441','#e8c874','#b5481f','#7a2f18'];
const AV_SHIRT = ['#7d2233','#f2b705','#6a2c91','#8bc34a','#f3ead6','#b5703c','#1f9bd1','#e5484d'];
function randomFace(){
  return {
    skin: Math.floor(Math.random()*AV_SKIN.length),
    hair: Math.floor(Math.random()*AV_HAIR.length),
    shirt: Math.floor(Math.random()*AV_SHIRT.length),
    style: Math.floor(Math.random()*4),
    beard: Math.random() < 0.35
  };
}
function avatarSVG(seed, size, face){
  size = size || 40;
  const h = hashStr(seed);
  const f = face || {};
  const N = 16;
  const g = Array.from({length:N}, () => Array(N).fill('.'));
  const SKIN  = AV_SKIN[f.skin  != null ? f.skin  : (h >>> 3)  % AV_SKIN.length];
  const HAIR  = AV_HAIR[f.hair  != null ? f.hair  : (h >>> 7)  % AV_HAIR.length];
  const SHIRT = AV_SHIRT[f.shirt != null ? f.shirt : (h >>> 11) % AV_SHIRT.length];
  const style = f.style != null ? f.style : (h >>> 15) % 4;
  const beard = f.beard != null ? f.beard : ((h >>> 17) & 1) === 1;
  const shirtRGB = (parseInt(SHIRT.slice(1,3),16)+parseInt(SHIRT.slice(3,5),16)+parseInt(SHIRT.slice(5,7),16));
  const K = shirtRGB > 560 ? '#7d2233' : '#f3ead6';

  const CX = 7.5, CY = 7.4, RX = 5.0, RY = 5.0;
  const inE = (x,y,rx,ry) => (((x-CX)/rx)**2 + ((y-CY)/ry)**2) <= 1;

  // pelo con volumen (arriba, un poco mas ancho)
  if(style !== 3){
    for(let y=0;y<N;y++) for(let x=0;x<N;x++)
      if(y <= 6 && inE(x,y,RX+1,RY+1)) g[y][x] = 'H';
  }

  // cara con sombreado lateral
  for(let y=0;y<N;y++) for(let x=0;x<N;x++)
    if(inE(x,y,RX,RY)) g[y][x] = x >= 10 ? 'd' : (x <= 4 ? 'L' : 'S');

  if(style !== 3){
    // linea de pelo segun estilo (corto / medio / largo)
    const hairline = [5,6,6][style];
    for(let y=0;y<N;y++) for(let x=0;x<N;x++)
      if(g[y][x] !== '.' && g[y][x] !== 'H' && y <= hairline) g[y][x] = 'H';

    // pelo a los costados segun el largo
    const sideBottom = [7,9,11][style];
    for(let y=5;y<=sideBottom;y++){ g[y][2] = 'H'; g[y][13] = 'H'; }
    g[6][3] = 'H'; g[6][12] = 'H';

    // brillo en la punta del pelo
    for(let y=0;y<N;y++) for(let x=0;x<N;x++)
      if(g[y][x] === 'H' && (!g[y-1] || g[y-1][x] === '.')) g[y][x] = 'l';
  }

  // rasgos
  g[6][4] = 'B'; g[6][5] = 'B'; g[6][10] = 'B'; g[6][11] = 'B';   // cejas
  g[7][4] = 'P'; g[7][5] = 'E'; g[7][10] = 'E'; g[7][11] = 'P';   // ojos
  g[9][7] = 'd'; g[9][8] = 'd';                                   // nariz

  // barba opcional
  if(beard){
    for(const x of [4,5,6,7,8,9,10,11]) if(g[10][x] !== '.') g[10][x] = 'h';
    for(const x of [5,6,7,8,9,10]) if(g[11][x] !== '.') g[11][x] = 'h';
    g[6][3] = 'h'; g[6][12] = 'h';
  }

  // boca
  g[10][6] = 'M'; g[10][7] = 'M'; g[10][8] = 'M'; g[10][9] = 'M';

  // cuello
  for(const x of [6,7,8,9]) g[12][x] = 'd';

  // camiseta
  for(let x=3;x<=12;x++) g[13][x] = 'C';
  for(let x=2;x<=13;x++) g[14][x] = 'C';
  for(let x=1;x<=14;x++) g[15][x] = 'C';
  g[13][7] = K; g[13][8] = K;                                     // cuello
  for(let y=13;y<=15;y++) for(let x=10;x<=13;x++) if(g[y][x]==='C') g[y][x]='c';
  g[15][7] = K; g[15][8] = K;                                     // franja

  // contorno de la silueta
  const src = g.map(r => r.slice());
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    if(src[y][x] !== '.') continue;
    const nb = (src[y-1]?.[x]??'.') + (src[y+1]?.[x]??'.') + (src[y]?.[x-1]??'.') + (src[y]?.[x+1]??'.');
    if(nb.replace(/\./g,'') !== '') g[y][x] = 'o';
  }

  const colMap = {
    'H':HAIR, 'h':shade(HAIR,0.7), 'l':shade(HAIR,1.5), 'B':'#141210',
    'S':SKIN, 'd':shade(SKIN,0.78), 'L':shade(SKIN,1.13),
    'E':'#f4fbff', 'P':'#1a1a1a', 'M':shade(SKIN,0.5),
    'C':SHIRT, 'c':shade(SHIRT,0.78), 'K':K,
    'o':'#08160d'
  };
  let rects = '';
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const v = g[y][x];
    if(v === '.' || !colMap[v]) continue;
    rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${colMap[v]}"/>`;
  }
  return `<svg class="pixel-avatar" width="${size}" height="${size}" viewBox="0 0 16 16" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" style="background:#0f2a19" aria-hidden="true">${rects}</svg>`;
}
function playerAvatar(p, size){ return avatarSVG(p.id, size, p.face); }

/* ---------- render ---------- */
function render(){
  $('#tabs').innerHTML = [['partidos','Partidos'],['estadisticas','Estadísticas'],['jugadores','Jugadores']]
    .map(([k,l])=>`<button data-action="tab" data-view="${k}" class="${view===k?'active':''}">${l}</button>`).join('');
  $('#app').innerHTML = view==='jugador' ? playerDetailHTML()
    : view==='jugadores' ? jugadoresHTML()
    : view==='estadisticas' ? statsHTML()
    : (currentMatchId ? matchDetailHTML() : partidosHTML());
}

/* ---------- Partidos ---------- */
function partidosHTML(){
  const ms = [...data.matches].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const head = `<div class="section-head"><h2>Partidos</h2>
    <button class="btn primary sm" data-action="new-match">+ Nuevo partido</button></div>`;
  if(!ms.length){
    return head + `<div class="empty"><span class="big">⚽</span>No hay partidos cargados todavía.<br>Tocá "Nuevo partido" para arrancar.</div>`;
  }
  const cards = ms.map(m=>{
    const a=scoreOf(m,'A'), b=scoreOf(m,'B');
    const title = m.rivalName ? `${esc(m.teamAName)} vs ${esc(m.rivalName)}`
                              : `${esc(m.teamAName)} vs ${esc(m.teamBName)}`;
    const mvp = m.mvpId ? `<span class="tag mvp">Figura: ${esc(pname(m.mvpId))}</span>` : '';
    const hach = m.hachazoId ? `<span class="tag hachazo">Hachazo: ${esc(pname(m.hachazoId))}</span>` : '';
    return `<article class="card match-card" data-action="open-match" data-id="${m.id}">
      <div class="match-top"><span class="date">${fmtDate(m.date)}</span><span class="tags">${mvp}${hach}</span></div>
      <div class="match-title">${title}</div>
      <div class="score"><b>${a}</b><span>-</span><b>${b}</b></div>
    </article>`;
  }).join('');
  return head + cards + escabioPostHTML();
}

function escabioPostHTML(){
  const ms = [...data.matches].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!ms.length) return '';
  if(!escabioMatchId || !ms.find(m=>m.id===escabioMatchId)) escabioMatchId = ms[0].id;
  const m = ms.find(x=>x.id===escabioMatchId);
  const opts = ms.map(x=>`<option value="${x.id}" ${x.id===m.id?'selected':''}>${fmtDate(x.date)} · ${esc(x.teamAName)} vs ${esc(x.teamBName)}</option>`).join('');

  const played = [...(m.teamA||[]), ...(m.teamB||[])].filter(id=>getPlayer(id));
  const escRows = played.map(id=>{
    const q = escQty(m, id);
    return `<div class="assign-row">
      <span class="pname">${playerAvatar(getPlayer(id),26)}${esc(pname(id))}</span>
      <div class="esc-ctrl">
        <button class="icon-btn" data-action="esc-dec" data-id="${id}">−</button>
        <span class="esc-val">${q}</span>
        <button class="icon-btn" data-action="esc-inc" data-id="${id}">+</button>
      </div>
    </div>`;
  }).join('') || '<p class="muted">Ese partido no tiene jugadores asignados.</p>';

  const cs = m.comments || [];
  const comments = cs.length ? cs.map(c=>`<div class="comment">
      <div class="comment-head"><b>${esc(c.author||'Anónimo')}</b>
        <span class="comment-time">${c.ts?new Date(c.ts).toLocaleString():''}</span>
        <button class="icon-btn" data-action="del-comment" data-id="${c.id}">×</button></div>
      <p class="comment-text">${esc(c.text)}</p>
    </div>`).join('') : '<p class="muted">Todavía no hay comentarios.</p>';

  return `<div class="card">
    <h3>Post-partido</h3>
    <label>Partido<select id="esc-match">${opts}</select></label>
    <h3 style="margin-top:4px">Escabio <span class="hint">· ${escTotal(m)}</span></h3>
    ${escRows}
    <h3 style="margin-top:16px">Comentarios <span class="hint">· ${cs.length}</span></h3>
    <div class="comment-list">${comments}</div>
    <label>Tu nombre<input id="c-name" type="text" value="${esc(commentName)}" placeholder="Ej: Tuti" autocomplete="off"></label>
    <label>Comentario<textarea id="c-text" rows="2" placeholder="¿Cómo estuvo el partido?" autocomplete="off"></textarea></label>
    <button class="btn primary block" data-action="add-comment">Comentar</button>
  </div>`;
}

function matchDetailHTML(){
  const m = data.matches.find(x=>x.id===currentMatchId);
  if(!m){ currentMatchId=null; return partidosHTML(); }
  const a=scoreOf(m,'A'), b=scoreOf(m,'B');
  const isRival = m.mode==='rival';

  const assign = data.players.length ? data.players.map(p=>{
    const inA=m.teamA.includes(p.id), inB=m.teamB.includes(p.id);
    const bBtn = isRival ? '' :
      `<button class="sidebtn ${inB?'on':''}" data-action="toggle-team" data-id="${p.id}" data-side="B">B</button>`;
    return `<div class="assign-row">
      <span class="pname">${playerAvatar(p,30)}${p.number?`<span class="num">${esc(p.number)}</span>`:''}${esc(pname(p.id))}</span>
      <div class="side-btns">
        <button class="sidebtn ${inA?'on':''}" data-action="toggle-team" data-id="${p.id}" data-side="A">${isRival?'Juega':'A'}</button>
        ${bBtn}
      </div>
    </div>`;
  }).join('') : '<p class="muted">Primero cargá jugadores en la pestaña Jugadores.</p>';

  const goals = m.events.length ? m.events.map(ev=>{
    const sideName = ev.side==='A' ? m.teamAName : m.teamBName;
    const scorer = ev.scorerId ? esc(pname(ev.scorerId)) : 'Gol del rival';
    const as = ev.assistId ? ` <span class="as">(asist. ${esc(pname(ev.assistId))})</span>` : '';
    return `<div class="goal-row">
      <span class="goal-side">${esc(sideName)}</span>
      <span class="goal-main">${scorer}${as}</span>
      <button class="icon-btn" data-action="del-goal" data-id="${ev.id}">×</button>
    </div>`;

/* ---------- Estadísticas ---------- */
function computeStats(){
  const st = {};
  data.players.forEach(p=> st[p.id]={pj:0,goles:0,asist:0,mvp:0,v:0,d:0,e:0,escabio:0,patadas:0,hachazos:0,racha:0,rachaAct:0});
  data.matches.forEach(m=>{
    const a = scoreOf(m,'A'), b = scoreOf(m,'B');
    const resA = a>b ? 'v' : a<b ? 'd' : 'e';
    const resB = b>a ? 'v' : b<a ? 'd' : 'e';
    (m.teamA||[]).forEach(id=>{ if(st[id]){ st[id].pj++; st[id][resA]++; } });
    (m.teamB||[]).forEach(id=>{ if(st[id]){ st[id].pj++; st[id][resB]++; } });
    (m.events||[]).forEach(ev=>{
      if(ev.scorerId && st[ev.scorerId]) st[ev.scorerId].goles++;
      if(ev.assistId && st[ev.assistId]) st[ev.assistId].asist++;
    });
    if(m.mvpId && st[m.mvpId]) st[m.mvpId].mvp++;
    if(m.hachazoId && st[m.hachazoId]) st[m.hachazoId].hachazos++;
    data.players.forEach(p=>{ st[p.id].escabio += escQty(m, p.id); st[p.id].patadas += patQty(m, p.id); });
  });
  // racha invicta (actual y mejor historica) por jugador
  data.players.forEach(p=>{
    const ms = data.matches
      .filter(m=>(m.teamA||[]).includes(p.id) || (m.teamB||[]).includes(p.id))
      .sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    let best = 0, cur = 0;
    ms.forEach(m=>{
      const side = (m.teamA||[]).includes(p.id) ? 'A' : 'B';
      const a = scoreOf(m,'A'), b = scoreOf(m,'B');
      const my = side==='A'?a:b, op = side==='A'?b:a;
      if(my >= op){ cur++; if(cur>best) best=cur; } else cur=0;
    });
    st[p.id].rachaAct = cur;
    st[p.id].racha = best;
  });
  return st;
}
function rankCats(){
  return {
    goles:  ['Goles',            s=>s.goles],
    asist:  ['Asistencias',      s=>s.asist],
    ga:     ['Goles + Asist.',   s=>s.goles+s.asist],
    mvp:    ['Figuras',          s=>s.mvp],
    pj:     ['Partidos jugados', s=>s.pj],
    v:      ['Victorias',        s=>s.v],
    d:      ['Derrotas',         s=>s.d],
    invicto:['Invictos',         s=>s.v+s.e],
    racha:  ['Racha invicta',    s=>s.racha],
    escabio:['Escabio',          s=>s.escabio],
    patadas:['Patadas',          s=>s.patadas],
    hachazos:['Hachazos',        s=>s.hachazos]
  };
}
function rankingHTML(){
  const cats = rankCats();
  const st = computeStats();
  const [label, fn] = cats[rankCat] || cats.goles;
  const rows = data.players.map(p=>({p, s:st[p.id]}))
    .filter(r=> fn(r.s) > 0)
    .sort((x,y)=> fn(y.s)-fn(x.s) || y.s.goles-x.s.goles || y.s.asist-x.s.asist || x.p.name.localeCompare(y.p.name));
  const pills = Object.keys(cats).map(k=>`<button class="cat-pill ${rankCat===k?'on':''}" data-action="rank-cat" data-cat="${k}">${esc(cats[k][0])}</button>`).join('');
  const head = `<div class="section-head"><h2>Ranking</h2></div><div class="cat-pills">${pills}</div>`;
  if(!rows.length) return `<div class="card">${head}<p class="muted">Sin datos todavía.</p></div>`;
  const pod = rows.slice(0,3).map((r,i)=>`
    <div class="podium-item p${i+1}">
      <span class="medal">${i+1}°</span>
      ${playerAvatar(r.p,54)}
      <span class="podium-name">${esc(pname(r.p.id))}</span>
      <span class="podium-val">${fn(r.s)}</span>
      <span class="podium-cat">${esc(label)}</span>
    </div>`).join('');
  const rest = rows.map((r,i)=>`
    <div class="rank-row clickable" data-action="open-player" data-id="${r.p.id}">
      <span class="rank-pos">${i+1}</span>
      ${playerAvatar(r.p,30)}
      <span class="rank-name">${esc(r.p.name)} <span class="rank-sub">· ${r.s.pj} PJ</span></span>
      <span class="rank-val">${fn(r.s)}</span>
    </div>`).join('');
  return `<div class="card">${head}<div class="podium">${pod}</div><div class="rank-list">${rest}</div></div>`;
}

function statsHTML(){
  const st = computeStats();
  const rows = data.players.map(p=>({p, s:st[p.id]}))
    .filter(r=> r.s.pj || r.s.goles || r.s.asist || r.s.mvp || r.s.escabio)
    .sort((x,y)=> y.s.goles-x.s.goles || y.s.asist-x.s.asist || y.s.v-x.s.v || x.p.name.localeCompare(y.p.name));
  const head = `<div class="section-head"><h2>Estadísticas</h2></div>`;
  if(!rows.length){
    return head + `<div class="empty"><span class="big">📊</span>Todavía no hay datos.<br>Cargá un partido y empezá a sumar.</div>`;
  }
  const topWin = rows.filter(r=>r.s.v>0).sort((x,y)=>y.s.v-x.s.v)[0];
  const topLoss = rows.filter(r=>r.s.d>0).sort((x,y)=>y.s.d-x.s.d)[0];
  const summary = `<div class="card summary">
    <div class="sum-item"><span class="lbl">Más ganó</span>
      <span class="val">${topWin?`${playerAvatar(topWin.p,26)}<b>${esc(pname(topWin.p.id))}</b><span class="pill win">${topWin.s.v} V</span>`:'<span class="muted">—</span>'}</span></div>
    <div class="sum-item"><span class="lbl">Más perdió</span>
      <span class="val">${topLoss?`${playerAvatar(topLoss.p,26)}<b>${esc(pname(topLoss.p.id))}</b><span class="pill loss">${topLoss.s.d} D</span>`:'<span class="muted">—</span>'}</span></div>
  </div>`;
  const body = rows.map((r,i)=>`<tr>
    <td class="c"><span class="rk">${i+1}</span></td>
    <td class="clickable" data-action="open-player" data-id="${r.p.id}"><span class="pname">${playerAvatar(r.p,26)}${r.p.number?`<span class="num">${esc(r.p.number)}</span>`:''}${esc(r.p.name)}</span></td>
    <td class="c">${r.s.pj}</td>
    <td class="c"><b>${r.s.goles}</b></td>
    <td class="c">${r.s.asist}</td>
    <td class="c win">${r.s.v||''}</td>
    <td class="c">${r.s.e||''}</td>
    <td class="c loss">${r.s.d||''}</td>
    <td class="c gold">${r.s.racha||''}</td>
    <td class="c loss">${r.s.patadas||''}</td>
    <td class="c loss">${r.s.hachazos||''}</td>
    <td class="c">${r.s.escabio||''}</td>
    <td class="c">${r.s.mvp||''}</td>
  </tr>`).join('');
  return head + rankingHTML() + summary + `<div class="card"><div class="table-wrap"><table class="table">
    <thead><tr><th class="c">#</th><th>Jugador</th><th class="c">PJ</th><th class="c">G</th><th class="c">A</th><th class="c">V</th><th class="c">E</th><th class="c">D</th><th class="c">Rach</th><th class="c">Pat</th><th class="c">Hach</th><th class="c">Esc</th><th class="c">MVP</th></tr></thead>
    <tbody>${body}</tbody>
  </table></div></div>
  <p class="muted" style="text-align:center">PJ: jugados · G: goles · A: asistencias · V: ganados · E: empatados · D: perdidos · Rach: mejor racha invicta · Pat: patadas · Hach: hachazos · Esc: escabios · MVP: figura</p>`;
}

        </div>
      </div>`;
  }
  const s = computeStats()[p.id] || {pj:0,goles:0,asist:0,mvp:0,v:0,d:0,e:0,escabio:0,patadas:0,hachazos:0,racha:0,rachaAct:0};
  const played = data.matches
    .filter(m=>(m.teamA||[]).includes(p.id) || (m.teamB||[]).includes(p.id))
    .sort((a,b)=>(a.date||'').localeCompare(b.date||''));

  const invictos = s.v + s.e;
  const tiles = [['PJ',s.pj,''],['V',s.v,'win'],['E',s.e,''],['D',s.d,'loss'],
                 ['Goles',s.goles,''],['Asist.',s.asist,''],['Patadas',s.patadas,'loss'],['Hachazos',s.hachazos,'loss'],
                 ['Figura',s.mvp,'gold'],['Escabio',s.escabio,'gold']]
    .map(([l,v,c])=>`<div class="tile"><span class="tile-num ${c}">${v}</span><span class="tile-lbl">${l}</span></div>`).join('');

  const log = played.length ? played.map(m=>{
    const side = (m.teamA||[]).includes(p.id) ? 'A' : 'B';
    const a = scoreOf(m,'A'), b = scoreOf(m,'B');
    const my = side==='A'?a:b, opp = side==='A'?b:a;
    const res = my>opp?'G':my<opp?'P':'E';
    const rc = res==='G'?'win':res==='P'?'loss':'draw';
    const g = (m.events||[]).filter(ev=> ev.side===side && ev.scorerId===p.id).length;
    const as = (m.events||[]).filter(ev=> ev.side===side && ev.assistId===p.id).length;
    const oppName = side==='A' ? m.teamBName : m.teamAName;
    const mvp = m.mvpId===p.id ? '<span class="tag mvp">Figura</span>' : '';
    const contrib = `${g?`<span class="pill gold">${g} G</span>`:''}${as?`<span class="pill">${as} A</span>`:''}`;
    return `<div class="log-row">
      <span class="res ${rc}">${res}</span>
      <div class="log-info"><span class="log-date">${fmtDate(m.date)}</span>
        <span class="log-vs">vs ${esc(oppName)}</span>${mvp}</div>
      <span class="log-score">${my}-${opp}</span>
      <span class="log-contrib">${contrib}</span>
    </div>`;
  }).join('') : '<p class="muted">Todavía no jugó partidos.</p>';

  return `
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <button class="btn ghost sm" data-action="player-back">← Volver</button>
      <button class="btn ghost sm" data-action="edit-player">Editar</button>
    </div>
    <div class="card">
      <div class="profile-top">
        ${playerAvatar(p,72)}
        <div>
          <h2>${esc(p.name)}</h2>
          ${p.nickname?`<p class="muted">"${esc(p.nickname)}"</p>`:''}
          <p class="muted">${p.number?'Dorsal '+esc(p.number):''}${p.number&&p.position?' · ':''}${p.position?esc(p.position):''}</p>
        </div>
      </div>
      <div class="tiles">${tiles}</div>
      <div class="streak-box">
        <div class="streak-item"><span class="streak-num">${invictos}</span><span class="streak-lbl">Partidos invictos</span></div>
        <div class="streak-item"><span class="streak-num">${s.rachaAct}</span><span class="streak-lbl">Racha actual</span></div>
        <div class="streak-item"><span class="streak-num">${s.racha}</span><span class="streak-lbl">Mejor racha</span></div>
      </div>
    </div>
    <div class="card"><h3>Partido a partido</h3>${log}</div>
  `;
}

        <p class="muted">Todo se guarda en la nube: lo que carga uno lo ven todos al instante. No hace falta registrarse. Tip: agregá la web a la pantalla de inicio del celu.</p></details>
    </div>
  `;
}

/* ---------- Modales ---------- */
function openModal(html){ $('#modal-root').innerHTML = `<div class="overlay" data-action="overlay"><div class="modal">${html}</div></div>`; }
function closeModal(){ $('#modal-root').innerHTML = ''; }

function openNewMatch(){
  const today = new Date().toISOString().slice(0,10);
  openModal(`
    <h3>Nuevo partido</h3>
    <label>Fecha<input type="date" id="m-date" value="${today}"></label>
    <label>Modalidad
      <select id="m-mode">
        <option value="interno">Interno (7 vs 7 entre nosotros)</option>
        <option value="rival">Contra un rival</option>
      </select>
    </label>
    <div id="m-rival-wrap" style="display:none">
      <label>Nombre del rival<input type="text" id="m-rival" placeholder="Ej: Los Pibes FC" autocomplete="off"></label>
    </div>
    <div class="modal-actions">
      <button class="btn ghost" data-action="modal-close">Cancelar</button>
      <button class="btn primary" data-action="create-match">Crear</button>
    </div>
  `);
}

function openAddGoal(side){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!m) return;
  const roster = side==='A' ? m.teamA : m.teamB;
  const isRivalSide = m.mode==='rival' && side==='B';
  if(!isRivalSide && !roster.length){ alert('Primero asigná jugadores a ese equipo.'); return; }
  const opts = roster.map(id=>`<option value="${id}">${esc(pname(id))}</option>`).join('');
  const sideName = side==='A' ? m.teamAName : m.teamBName;
  openModal(`
    <h3>Gol de ${esc(sideName)}</h3>
    <label>Goleador ${isRivalSide?'<span class="hint">(rival)</span>':''}
      <select id="g-scorer">
        ${isRivalSide?'<option value="">Gol del rival (sin jugador)</option>':''}
        ${opts}
      </select>
    </label>
    ${isRivalSide ? '' : `<label>Asistencia <span class="hint">(opcional)</span>
      <select id="g-assist"><option value="">Sin asistencia</option>${opts}</select>
    </label>`}
    <input type="hidden" id="g-side" value="${side}">
    <div class="modal-actions">
      <button class="btn ghost" data-action="modal-close">Cancelar</button>
      <button class="btn primary" data-action="confirm-goal">Guardar gol</button>
    </div>
  `);
}

/* ---------- Acciones ---------- */
function createMatch(){
  const date = $('#m-date').value;
  const mode = $('#m-mode').value;
  const rival = mode==='rival' ? ($('#m-rival').value.trim() || 'Rival') : '';
  const m = {
    id: uid(), date, mode,
    teamAName: mode==='rival' ? 'Piel Morena' : 'Equipo A',
    teamBName: mode==='rival' ? rival : 'Equipo B',
    rivalName: rival,
    teamA: [], teamB: [], events: [], mvpId: null
  };
  data.matches.push(m); save(); persistMatch(m); closeModal();
  currentMatchId = m.id; view='partidos'; render();
}
function toggleTeam(pid, side){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!m) return;
  const arr = side==='A' ? m.teamA : m.teamB;
  const other = side==='A' ? m.teamB : m.teamA;
  const i = arr.indexOf(pid);
  if(i>=0) arr.splice(i,1);
  else { const j=other.indexOf(pid); if(j>=0) other.splice(j,1); arr.push(pid); }
  save(); persistMatch(m); render();
}
function escAdjust(pid, delta){
  const m = data.matches.find(x=>x.id===escabioMatchId); if(!m) return;
  if(!m.escabio || Array.isArray(m.escabio)) m.escabio = migEsc(m);
  let q = (Number(m.escabio[pid]) || 0) + delta;
  if(q < 0) q = 0;
  if(q === 0) delete m.escabio[pid]; else m.escabio[pid] = q;
  save(); persistMatch(m); render();
}
function patAdjust(pid, delta){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!m) return;
  if(!m.patadas || Array.isArray(m.patadas)) m.patadas = migMap(m.patadas);
  let q = (Number(m.patadas[pid]) || 0) + delta;
  if(q < 0) q = 0;
  if(q === 0) delete m.patadas[pid]; else m.patadas[pid] = q;
  save(); persistMatch(m); render();
}
function addComment(){
  const m = data.matches.find(x=>x.id===escabioMatchId); if(!m) return;
  const nameEl = document.getElementById('c-name');
  const textEl = document.getElementById('c-text');
  const name = nameEl ? nameEl.value.trim() : '';
  const text = textEl ? textEl.value.trim() : '';
  if(!text){ alert('Escribí un comentario.'); return; }
  if(name){ commentName = name; localStorage.setItem('pmfc_name', name); }
  if(!m.comments) m.comments = [];
  m.comments.push({ id: uid(), author: name || 'Anónimo', text, ts: Date.now() });
  save(); persistMatch(m); render();
}
function delComment(cid){
  const m = data.matches.find(x=>x.id===escabioMatchId); if(!m || !m.comments) return;
  m.comments = m.comments.filter(c=>c.id!==cid);
  save(); persistMatch(m); render();
}
function confirmGoal(){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!m) return;
  const side = $('#g-side').value;
  const scorerId = $('#g-scorer').value || null;
  const assistEl = $('#g-assist');
  let assistId = assistEl ? (assistEl.value || null) : null;
  if(assistId === scorerId) assistId = null;
  m.events.push({ id: uid(), side, scorerId, assistId });
  sfx('goal'); save(); persistMatch(m); closeModal(); render();
}
function delGoal(id){
  const m = data.matches.find(x=>x.id===currentMatchId); if(!m) return;
  m.events = m.events.filter(e=>e.id!==id); save(); persistMatch(m); render();
}
function deleteMatch(id){
  if(!confirm('¿Eliminar este partido y sus estadísticas?')) return;
  data.matches = data.matches.filter(m=>m.id!==id);
  currentMatchId=null; save(); removeMatchDoc(id); render();
}
function addPlayer(){
  const name = $('#p-name').value.trim();
  if(!name){ alert('Poné al menos el nombre.'); return; }
  const p = {
    id: uid(), name,
    nickname: $('#p-nick').value.trim(),
    number: $('#p-num').value.trim(),
    position: $('#p-pos').value,
    face: Object.assign({}, newFace)
  };
  data.players.push(p);
  newFace = null;
  save(); persistPlayer(p); render();
}
function savePlayer(){
  const p = getPlayer(currentPlayerId); if(!p) return;
  const name = document.getElementById('e-name').value.trim();
  if(!name){ alert('Poné al menos el nombre.'); return; }
  p.name = name;
  p.nickname = document.getElementById('e-nick').value.trim();
  p.number = document.getElementById('e-num').value.trim();
  p.position = document.getElementById('e-pos').value;
  p.face = Object.assign({}, newFace);
  newFace = null;
  playerEditMode = false;
  save(); persistPlayer(p); render();
}
function updateFacePreview(){
  const el = document.getElementById('face-preview');
  if(el) el.innerHTML = avatarSVG('new-face',64,newFace);
  document.querySelectorAll('[data-action="face-set"]').forEach(sw=>{
    const k = sw.dataset.key;
    const v = sw.dataset.val;
    const on = k==='beard' ? (v==='1')===!!newFace.beard : String(newFace[k])===v;
    sw.classList.toggle('on', on);
  });
}
function delPlayer(id){
  const p = getPlayer(id); if(!p) return;
  if(!confirm(`¿Eliminar a ${p.name}?`)) return;
  data.players = data.players.filter(x=>x.id!==id);
  data.matches.forEach(m=>{
    m.teamA = m.teamA.filter(x=>x!==id);
    m.teamB = m.teamB.filter(x=>x!==id);
    m.events = (m.events||[]).filter(e=> e.scorerId!==id && e.assistId!==id);
    if(m.mvpId===id) m.mvpId=null;
  });
  save(); removePlayerDoc(id); data.matches.forEach(persistMatch); render();
}
function exportData(){
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download = 'piel-morena-fc.json'; a.click();
  URL.revokeObjectURL(url);
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json,application/json';
  inp.onchange = ()=>{
    const f = inp.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = ()=>{
      try{
        const d = JSON.parse(r.result);
        if(!Array.isArray(d.players) || !Array.isArray(d.matches)) throw 0;
        data = d; save(); currentMatchId=null; render();
        alert('Datos importados correctamente.');
      }catch(e){ alert('El archivo no es válido.'); }
    };
    r.readAsText(f);
  };
  inp.click();
}
async function resetData(){
  if(!confirm('Esto borra TODOS los jugadores y partidos (de este dispositivo y de la nube). ¿Seguro?')) return;
  if(!confirm('Última confirmación: se pierde todo. ¿Continuar?')) return;
  data = { players:[], matches:[] }; currentMatchId=null; escabioMatchId=null; save();
  if(fsReady()){
    try{
      const ps = await db.collection('players').get();
      const ms = await db.collection('matches').get();
      const batch = db.batch();
      ps.forEach(d=> batch.delete(d.ref));
      ms.forEach(d=> batch.delete(d.ref));
      await batch.commit();
    }catch(e){ cloudFail(e); }
  }
  render();
}
/* ---------- Himno 8-bit (composicion original) ---------- */
let himnoOn = false, himnoTimer = null, himnoOsc = [], noiseBuf = null;
const HNOTE = {C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function nfreq(n){ const m = /^([A-G]#?)(\d)$/.exec(n); return m ? 440*Math.pow(2, ((HNOTE[m[1]]-9)/12) + (+m[2]-4)) : 440; }
function hnote(n, t, dur, type, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'square'; o.frequency.value = nfreq(n);
  o.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
  himnoOsc.push(o);
}
function hnoise(t, dur, vol, hp){
  const c = ac(); if(!c) return;
  if(!noiseBuf){ const len = Math.floor(c.sampleRate*0.3); noiseBuf = c.createBuffer(1,len,c.sampleRate); const d = noiseBuf.getChannelData(0); for(let i=0;i<len;i++) d[i]=Math.random()*2-1; }
  const s = c.createBufferSource(); s.buffer = noiseBuf;
  const g = c.createGain();
  if(hp){ const f = c.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; s.connect(f); f.connect(g); } else s.connect(g);
  g.connect(c.destination);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.start(t); s.stop(t + dur + 0.02);
  himnoOsc.push(s);
}
function hkick(t, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(50, t + 0.12);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + 0.2);
  himnoOsc.push(o);
}
function htom(t, f0, f1, vol, dur){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(f0, t);
  o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + dur + 0.02);
  himnoOsc.push(o);
}
const HIMNO_BEAT = 0.55;
// Himno "latino" (cumbia 8-bit, composicion original) - Am F C G
const HIMNO_MEL = [
  ['A4',0,.5],['C5',.5,.5],['E5',1,.5],['A5',1.5,.5],['G5',2,1],['E5',3,1],
  ['F5',4,.5],['A5',4.5,.5],['G5',5,.5],['F5',5.5,.5],['E5',6,2],
  ['E5',8,.5],['G5',8.5,.5],['C6',9,.5],['B5',9.5,.5],['A5',10,1],['G5',11,1],
  ['D5',12,.5],['F5',12.5,.5],['E5',13,.5],['D5',13.5,.5],['E5',14,1],['A5',15,1]
];
const HIMNO_BARS = [['A2','E3'],['F2','C3'],['C3','G3'],['G2','D3']];
function himnoOnce(t0){
  himnoOsc = [];
  const beat = HIMNO_BEAT;
  HIMNO_MEL.forEach(([n,s,l])=> hnote(n, t0+s*beat, l*beat*0.9, 'square', 0.11));
  // tumbao: bajo en corcheas alternando raiz y quinta
  HIMNO_BARS.forEach(([root,fifth], bi)=>{
    for(let e=0; e<8; e++){
      hnote(e%2===0 ? root : fifth, t0 + bi*4*beat + e*0.5*beat, 0.5*beat*0.85, 'triangle', 0.16);
    }
  });
  // percusion tropical
  for(let b=0;b<16;b+=2) hkick(t0 + b*beat, 0.42);                          // bombo
  for(let b=1;b<16;b+=2) hnoise(t0 + b*beat, 0.09, 0.13, 1600);             // palma/rim
  for(let i=0;i<64;i++) hnoise(t0 + i*0.25*beat, 0.02, i%4===2 ? 0.055 : 0.03, 5500); // guira 16avos
  for(let b=0;b<16;b++) htom(t0 + (b+0.5)*beat, 220, 150, 0.13, 0.10);      // tom en contratiempo
}
function toggleHimno(){
  if(himnoOn){ stopHimno(); return; }
  const c = ac(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  himnoOn = true; updateHimnoBtn();
  const loopDur = 16*HIMNO_BEAT;
  let start = c.currentTime + 0.08;
  const step = ()=>{
    if(!himnoOn) return;
    himnoOnce(start);
    start += loopDur;
    himnoTimer = setTimeout(step, loopDur*1000 - 120);
  };
  step();
}
function stopHimno(){
  himnoOn = false;
  if(himnoTimer){ clearTimeout(himnoTimer); himnoTimer = null; }
  himnoOsc.forEach(o=>{ try{ o.stop(); }catch(e){} try{ o.disconnect(); }catch(e){} });
  himnoOsc = [];
  updateHimnoBtn();
}
function updateHimnoBtn(){
  const b = document.getElementById('music-btn');
  if(!b) return;
  b.textContent = himnoOn ? 'Parar' : 'Himno';
  b.classList.toggle('playing', himnoOn);
}

/* ---------- Efectos 8-bit (Web Audio, originales) ---------- */
let sfxOn = localStorage.getItem('pmfc_sfx') !== 'off';
let actx = null;
function ac(){
  if(actx) return actx;
  try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ actx = null; }
  return actx;
}
function tone(freq, start, dur, vol){
  const c = ac(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = 'square'; o.frequency.value = freq;
  o.connect(g); g.connect(c.destination);
  const t = c.currentTime + start;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.16, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.start(t); o.stop(t + dur + 0.02);
}
function sfx(name){
  if(!sfxOn) return;
  const c = ac(); if(!c) return;
  if(c.state === 'suspended') c.resume();
  const S = {
    goal:    [[523,0,.09],[659,.09,.09],[784,.18,.09],[1047,.27,.22]],
    mvp:     [[784,0,.08],[988,.08,.08],[1319,.16,.26]],
    add:     [[659,0,.07],[988,.07,.12]],
    del:     [[440,0,.09],[330,.09,.16]],
    escabio: [[196,0,.12],[185,.13,.12],[175,.26,.20]],
    click:   [[880,0,.04]]
  }[name];
  if(!S) return;
  S.forEach(([f,t,d])=> tone(f, t, d, name==='click' ? 0.07 : 0.16));
}
function updateSfxBtn(){
  const b = document.getElementById('sfx-btn');
  if(b) b.textContent = sfxOn ? 'Sonido' : 'Mudo';
}
function toggleSfx(){
  sfxOn = !sfxOn;
  localStorage.setItem('pmfc_sfx', sfxOn ? 'on' : 'off');
  updateSfxBtn();
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const a = t.dataset.action, id = t.dataset.id;
  switch(a){
    case 'tab': view = t.dataset.view; currentMatchId=null; render(); break;
    case 'open-match': currentMatchId=id; view='partidos'; render(); break;
    case 'back': currentMatchId=null; render(); break;
    case 'new-match': openNewMatch(); break;
    case 'create-match': createMatch(); break;
    case 'add-player': addPlayer(); break;
    case 'del-player': delPlayer(id); break;
    case 'face-set': {
      const k = t.dataset.key;
      if(k === 'beard') newFace.beard = !newFace.beard;
      else newFace[k] = parseInt(t.dataset.val, 10);
      updateFacePreview();
      break;
    }
    case 'face-random': newFace = randomFace(); updateFacePreview(); break;
    case 'open-player': playerBackView = view; currentPlayerId = id; playerEditMode = false; view='jugador'; render(); break;
    case 'player-back': playerEditMode = false; newFace = null; view = playerBackView; currentPlayerId = null; render(); break;
    case 'edit-player': { const p = getPlayer(currentPlayerId); if(!p) break; newFace = Object.assign({}, p.face || randomFace()); playerEditMode = true; render(); break; }
    case 'cancel-edit': playerEditMode = false; newFace = null; render(); break;
    case 'save-player': savePlayer(); break;
    case 'toggle-team': toggleTeam(id, t.dataset.side); break;
    case 'esc-inc': escAdjust(id, 1); break;
    case 'esc-dec': escAdjust(id, -1); break;
    case 'pat-inc': patAdjust(id, 1); break;
    case 'pat-dec': patAdjust(id, -1); break;
    case 'add-comment': addComment(); break;
    case 'del-comment': delComment(id); break;
    case 'rank-cat': rankCat = t.dataset.cat; render(); break;
    case 'add-goal': openAddGoal(t.dataset.side); break;
    case 'confirm-goal': confirmGoal(); break;
    case 'del-goal': delGoal(id); break;
    case 'delete-match': deleteMatch(id); break;
    case 'modal-close': closeModal(); break;
    case 'overlay': if(e.target===t) closeModal(); break;
    case 'export': exportData(); break;
    case 'import': importData(); break;
    case 'reset': resetData(); break;
    case 'cloud-save-config': saveFbConfig(); break;
    case 'cloud-change': changeFbConfig(); break;
    case 'cloud-help': openCloudHelp(); break;
    case 'toggle-sfx': toggleSfx(); break;
    case 'toggle-music': toggleHimno(); break;
  }
});
document.addEventListener('change', e=>{
  if(e.target.id==='m-mode'){
    const w = $('#m-rival-wrap');
    if(w) w.style.display = e.target.value==='rival' ? 'block' : 'none';
  }
  if(e.target.id==='esc-match'){ escabioMatchId = e.target.value; render(); }
  if(e.target.id==='mvp-select'){
    const m = data.matches.find(x=>x.id===currentMatchId);
    if(m){ m.mvpId = e.target.value || null; sfx('mvp'); save(); persistMatch(m); }
  }
  if(e.target.id==='hachazo-select'){
    const m = data.matches.find(x=>x.id===currentMatchId);
    if(m){ m.hachazoId = e.target.value || null; save(); persistMatch(m); }
  }
});

updateSfxBtn();
updateHimnoBtn();
render();
initCloud();
</script>
